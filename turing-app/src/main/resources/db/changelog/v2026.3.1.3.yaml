databaseChangeLog:
  # T30 / §IV.4 — per-agent conversation-relevance retrieval for chat memory.
  # Adds three columns on ai_agent:
  #   - chat_memory_relevance_enabled : opt-in toggle (default false so existing
  #                                     agents keep the recent-N FIFO behavior)
  #   - chat_memory_relevance_top_k   : number of older turns the BM25 retriever
  #                                     returns per request (default 5)
  #   - chat_memory_recent_n          : size of the recent FIFO window kept
  #                                     verbatim — the retriever ignores turns
  #                                     inside this window (default 10)
  #
  # Idempotent: each addColumn is gated by columnExists so re-running the
  # changeset on databases that already have any of the columns is a no-op.

  - changeSet:
      id: v2026.3.1.3-add-chat-memory-relevance-enabled-to-ai-agent
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: ai_agent
        - not:
            - columnExists:
                tableName: ai_agent
                columnName: chat_memory_relevance_enabled
      changes:
        - addColumn:
            tableName: ai_agent
            columns:
              - column:
                  name: chat_memory_relevance_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: "T30/§IV.4 — opt-in BM25 retrieval of older turns when persisted memory exceeds the recent-N window."

  - changeSet:
      id: v2026.3.1.3-add-chat-memory-relevance-top-k-to-ai-agent
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: ai_agent
        - not:
            - columnExists:
                tableName: ai_agent
                columnName: chat_memory_relevance_top_k
      changes:
        - addColumn:
            tableName: ai_agent
            columns:
              - column:
                  name: chat_memory_relevance_top_k
                  type: INT
                  defaultValueNumeric: 5
                  constraints:
                    nullable: false
                  remarks: "T30/§IV.4 — how many older turns the BM25 retriever returns per request."

  - changeSet:
      id: v2026.3.1.3-add-chat-memory-recent-n-to-ai-agent
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: ai_agent
        - not:
            - columnExists:
                tableName: ai_agent
                columnName: chat_memory_recent_n
      changes:
        - addColumn:
            tableName: ai_agent
            columns:
              - column:
                  name: chat_memory_recent_n
                  type: INT
                  defaultValueNumeric: 10
                  constraints:
                    nullable: false
                  remarks: "T30/§IV.4 — size of the recent FIFO window kept verbatim; BM25 retriever scores only turns older than this."
