databaseChangeLog:
  # T443 / §XXIII.2 — co-browse: per-agent opt-in flag that folds the built-in
  # co-browse client tools (set_search_query / toggle_facet / clear_facets /
  # set_sort / set_page) into the agent's advertised tool set and injects
  # prompts/co-browse.md. Default off keeps existing agents unchanged.
  #
  # Idempotent: gated by columnExists not present.

  - changeSet:
      id: v2026.3.1.56-add-ai_agent-co_browse_enabled
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: ai_agent
                columnName: co_browse_enabled
      changes:
        - addColumn:
            tableName: ai_agent
            columns:
              - column:
                  name: co_browse_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - update:
            tableName: ai_agent
            columns:
              - column:
                  name: co_browse_enabled
                  valueBoolean: false
            where: co_browse_enabled IS NULL
