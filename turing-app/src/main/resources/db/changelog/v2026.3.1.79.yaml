databaseChangeLog:
  # --- T507 / §XXVIII.3: Voyage AI LLM vendor (embeddings + rerank specialist) ---
  # Fresh installs are seeded by TurLLMVendorOnStartup; this row is for existing
  # installs whose llm_vendor table is already populated. Idempotent.
  - changeSet:
      id: v2026.3.1.79-01-add-voyage-vendor
      author: viglet-team
      preConditions:
        onFail: MARK_RAN
        and:
          - not:
              - sqlCheck:
                  expectedResult: "0"
                  sql: "SELECT COUNT(*) FROM llm_vendor"
          - sqlCheck:
              expectedResult: "0"
              sql: "SELECT COUNT(*) FROM llm_vendor WHERE id = 'VOYAGE'"
      changes:
        - insert:
            tableName: llm_vendor
            columns:
              - column:
                  name: id
                  value: VOYAGE
              - column:
                  name: description
                  value: "Voyage AI — retrieval-specialist embeddings + rerank (no chat API)"
              - column:
                  name: plugin
                  value: voyage
              - column:
                  name: title
                  value: "Voyage AI"
              - column:
                  name: website
                  value: "https://www.voyageai.com"
