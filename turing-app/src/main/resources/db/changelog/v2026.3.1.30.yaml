databaseChangeLog:
  # T262 / §XIV.2.6 — flip the @TenantId discriminator columns to NOT NULL now
  # that v..28 / v..29 have backfilled every existing row to DEFAULT. Separate
  # follow-up changelog (never edit a shipped one). defaultNullValue=DEFAULT is
  # belt-and-suspenders in case any row slipped through as NULL.
  #
  # Idempotent: guarded by columnExists with onFail:MARK_RAN.

  - changeSet:
      id: v2026.3.1.30-tenantId-notnull-sn_site
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: sn_site
            columnName: tenantId
      changes:
        - addNotNullConstraint:
            tableName: sn_site
            columnName: tenantId
            columnDataType: VARCHAR(40)
            defaultNullValue: DEFAULT
