databaseChangeLog:
  # --- llm_instance: Spring AI columns (individual, idempotent) ---
  - changeSet:
      id: v2026.1.11-02a-llm-provider-options-json-if-missing
      author: viglet-team
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          or:
            - columnExists:
                tableName: llm_instance
                columnName: providerOptionsJson
            - columnExists:
                tableName: llm_instance
                columnName: provider_options_json
      changes:
        - addColumn:
            tableName: llm_instance
            columns:
              - column:
                  name: providerOptionsJson
                  type: TEXT

  - changeSet:
      id: v2026.1.11-02b-llm-api-key-encrypted-if-missing
      author: viglet-team
      preConditions:
