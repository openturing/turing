databaseChangeLog:
  # Add icon column to all main entities
  - changeSet:
      id: add-icon-column-to-llm-instance
      author: alexandre
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: llm_instance
            columnName: icon
      changes:
        - addColumn:
            tableName: llm_instance
            columns:
              - column:
                  name: icon
                  type: varchar(150)

