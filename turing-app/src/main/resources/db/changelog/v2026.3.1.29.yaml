databaseChangeLog:
  # T261 / §XIV.2.5 — fan the Hibernate @TenantId discriminator column across
  # every tenant-owned aggregate root (the TurSNSite pilot shipped in v..28).
  # Shared infra tables (llm_instance, embedding_model, store_instance,
  # se_instance, mcp_server, integration_instance) are intentionally EXCLUDED
  # here — they use the nullable `tenantId = current ∪ NULL` model in T275.
  # RBAC / global-settings tables stay global (Block J non-goal).
  #
  # Same contract as v..28: column nullable + defaultValue DEFAULT (so even
  # non-Hibernate inserts get DEFAULT), then backfill existing NULLs. NOT NULL
  # is flipped later in T262. Each changeSet is idempotent (not columnExists).

  - changeSet:
      id: v2026.3.1.29-add-tenantId-to-ai_agent
      author: alexandre-oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: ai_agent
                columnName: tenantId
      changes:
        - addColumn:
            tableName: ai_agent
            columns:
              - column:
                  name: tenantId
                  type: VARCHAR(40)
                  defaultValue: DEFAULT
        - update:
            tableName: ai_agent
            columns:
              - column:
                  name: tenantId
                  value: DEFAULT
            where: tenantId IS NULL
