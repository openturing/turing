<!-- Site Card: {{siteName}} -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-bottom:4px;">
    <tr>
        <td style="padding:24px 32px;">
            <!-- Site Header -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                    <td>
                        <div style="display:inline-block;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;width:36px;height:36px;text-align:center;line-height:36px;font-size:16px;color:#ffffff;font-weight:700;vertical-align:middle;">
                            {{siteInitial}}
                        </div>
                        <span style="font-size:18px;font-weight:700;color:#f1f5f9;vertical-align:middle;margin-left:12px;">
                            {{siteName}}
                        </span>
                    </td>
                </tr>
            </table>

            <!-- Stats Row -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-top:16px;">
                <tr>
                    <td width="50%" style="padding-right:8px;">
                        <div style="background:#0f172a;border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:6px;">Searches</div>
                            <div style="font-size:28px;font-weight:800;color:#818cf8;line-height:1;">{{siteSearchCount}}</div>
                        </div>
                    </td>
                    <td width="50%" style="padding-left:8px;">
                        <div style="background:#0f172a;border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:6px;">Indexed Items</div>
                            <div style="font-size:28px;font-weight:800;color:#34d399;line-height:1;">{{siteDocumentCount}}</div>
                        </div>
                    </td>
                </tr>
            </table>

            <!-- Top Searches -->
            <div style="margin-top:16px;">
                <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:10px;font-weight:600;">
                    Top Searches This Week
                </div>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#0f172a;border-radius:12px;overflow:hidden;">
                    {{topSearchRows}}
                </table>
            </div>

            <!-- Divider -->
            <div style="border-bottom:1px solid #334155;margin-top:24px;"></div>
        </td>
    </tr>
</table>
