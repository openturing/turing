<!-- Per-site AI Summary -->
<div style="margin-top:20px;">
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#64748b;margin-bottom:10px;font-weight:700;">
        &#x2728; AI Insights
    </div>
    <div style="background:#0d0d14;border:1px solid #1e1e2e;border-radius:12px;padding:18px 20px;border-left:3px solid #3b82f6;">
        <div style="font-size:13px;color:#cbd5e1;line-height:1.7;">
            {{aiInsightsContent}}
        </div>
        <div style="margin-top:12px;text-align:right;">
            <span style="font-size:10px;color:#475569;background:#16161f;border-radius:4px;padding:3px 8px;">
                {{llmModelName}}
            </span>
        </div>
    </div>
</div>
