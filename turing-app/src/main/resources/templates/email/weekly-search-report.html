<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Weekly Search Report</title>
</head>
<body style="margin:0;padding:0;background-color:#0f172a;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#0f172a;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="640" style="max-width:640px;width:100%;">

                    <!-- Header -->
                    <tr>
                        <td style="background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);border-radius:16px 16px 0 0;padding:40px 32px 32px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td>
                                        <div style="display:inline-block;background:rgba(255,255,255,0.2);border-radius:12px;padding:10px 14px;margin-bottom:16px;">
                                            <span style="font-size:24px;line-height:1;">&#x1F50D;</span>
                                        </div>
                                        <h1 style="margin:12px 0 4px;font-size:28px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">
                                            Weekly Search Report
                                        </h1>
                                        <p style="margin:0;font-size:15px;color:rgba(255,255,255,0.8);font-weight:400;">
                                            {{reportPeriod}}
                                        </p>
                                    </td>
                                    <td align="right" valign="top">
                                        <div style="background:rgba(255,255,255,0.15);border-radius:12px;padding:12px 16px;text-align:center;">
                                            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.7);margin-bottom:4px;">Total Searches</div>
                                            <div style="font-size:32px;font-weight:800;color:#ffffff;line-height:1;">{{totalSearches}}</div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="background-color:#1e293b;padding:0;">

                            <!-- Site Cards -->
                            {{siteCards}}

                            <!-- Footer -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td style="padding:24px 32px 32px;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-top:1px solid #334155;padding-top:24px;">
                                            <tr>
                                                <td>
                                                    <p style="margin:0;font-size:12px;color:#64748b;line-height:1.5;">
                                                        This report was automatically generated by
                                                        <strong style="color:#94a3b8;">Viglet Turing</strong>
                                                        on {{generatedAt}}.
                                                    </p>
                                                    <p style="margin:8px 0 0;font-size:12px;color:#475569;">
                                                        Powered by Turing Enterprise Search Intelligence Platform
                                                    </p>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Bottom Gradient Bar -->
                    <tr>
                        <td style="background:linear-gradient(135deg,#6366f1,#a855f7);height:4px;border-radius:0 0 16px 16px;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
