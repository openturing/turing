# =============================================================================
# Turing ES — Application Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Turing
# ---------------------------------------------------------------------------
turing:
  ai.crypto.key: sample-key-for-crypto
  allowedOrigins: http://localhost:4200,http://localhost:5173
  permissions: false
  multi-tenant: false
  keycloak: false
  keycloak-admin-id:
  authentication:
    thirdparty: true
    new-user: true
  url: http://localhost:2700
  open-browser: true
  jms.concurrency: 1-1
  solr:
    timeout: 30000
    cloud: false
    # When enabled=true and endpoint is set, Turing uses this endpoint directly
    # and the SE instance catalog becomes read-only (no new Solr instances can be
    # created from the UI/API). Leave enabled=false to keep the default JPA mode.
    enabled: false
    endpoint:
    commit:
      within: 10000
      enabled: false
  elasticsearch:
    timeout: 30000
  search:
    metrics.enabled: true
    cache:
      ttl:
        seconds: 86400000
      enabled: false
  storage:
    type: FILESYSTEM
    filesystem:
      path: ./store/assets
    minio:
      endpoint: http://localhost:9000
      access-key: admin
      secret-key: minha_senha_forte
      bucket: turing-assets
  git:
    server: false
  marketplace:
    enabled: true
    url: https://turing.viglet.org/marketplace/marketplace.json
  genai:
    reindex:
      # Number of documents indexed in parallel during a RAG reindex.
      # Embedding HTTP calls are I/O-bound, so a small fixed pool fully utilizes
      # the embedding API without saturating typical rate limits. Set to 1 to
      # force sequential indexing (useful for debugging or rate-limited APIs).
      parallel: 4
  logging:
    engine: none        # none | mongodb | redis
    database: turingLog
    collection:
      server: server
      aem: aem
      indexing: indexing
    purge:
      days: 30
  mongodb:
    enabled: false
    uri: mongodb://localhost:27017
  redis:
    enabled: false
    uri: redis://localhost:6379/0

# ---------------------------------------------------------------------------
# Spring
# ---------------------------------------------------------------------------
spring:
  datasource.hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 600000
    pool-name: TurConnectionPool
  jmx.enabled: true
  profiles:
    active: production
  h2:
    console:
      enabled: false
      path: /h2
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:h2:file:./store/db/turingDB;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: PUBLIC
  jpa:
    properties:
      hibernate:
        "[globally_quoted_identifiers]": true
        "[format_sql]": false
        "[enable_lazy_load_no_trans]": true
        "[generate_statistics]": false
      "[jakarta.persistence.sharedCache.mode]": ALL
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    mapper:
      "[DEFAULT_VIEW_INCLUSION]": true
  thymeleaf:
    mode: HTML
    check-template: true
    check-template-location: true
    prefix: classpath:public/
    suffix: .html
  artemis:
    mode: embedded
    broker-url: localhost:61616
    embedded:
      enabled: true
      persistent: true
      data-directory: store/queue
      queues: indexing.queue
    pool:
      max-connections: 10
  jms:
    template:
      default-destination: indexing.queue
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  mvc:
    async:
      request-timeout: 3600000
  output:
    ansi:
      enabled: always
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    http.path: /graphql
    cors:
      allowed-origins: ${turing.allowedOrigins}
      allowed-methods: GET,POST
      allowed-headers: "*"

  # -------------------------------------------------------------------------
  # OAuth2 Social Login (uncomment to enable)
  # -------------------------------------------------------------------------
  # Redirect URI pattern: {baseUrl}/login/oauth2/code/{registrationId}
  # Example: http://localhost:2700/login/oauth2/code/google
  #
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #         github:
  #           client-id: ${GITHUB_CLIENT_ID}
  #           client-secret: ${GITHUB_CLIENT_SECRET}
  #         microsoft:
  #           client-id: ${MICROSOFT_CLIENT_ID}
  #           client-secret: ${MICROSOFT_CLIENT_SECRET}
  #           scope: openid,profile,email
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #         keycloak:
  #           client-id: ${KEYCLOAK_CLIENT_ID}
  #           client-secret: ${KEYCLOAK_CLIENT_SECRET}
  #           scope: openid
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #       provider:
  #         microsoft:
  #           issuer-uri: https://login.microsoftonline.com/common/v2.0
  #         keycloak:
  #           issuer-uri: http://localhost:8080/realms/demo

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: ${PORT:2700}
  servlet:
    session:
      cookie:
        name: TURJSESSIONID
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
    min-response-size: 2048
  tomcat:
    accesslog:
      enabled: false
      suffix: .log
      prefix: access_log
      file-date-format: .yyyy-MM-dd
      directory: logs
    basedir: store
    threads:
      max: 600
    max-swallow-size: 200MB
    max-http-form-post-size: 200MB
    maxHttpResponseHeaderSize: 800KB

# ---------------------------------------------------------------------------
# API Documentation
# ---------------------------------------------------------------------------
springdoc:
  pathsToMatch: /api/**
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Management
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: "*"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  config: classpath:logback-spring.xml
  level:
    org:
      springframework: INFO
      apache: INFO
      "[apache.activemq]": ERROR
    com:
      viglet: INFO
    dev:
      langchain4j: INFO
      ai4j:
        openai4j: INFO
  file:
    name: store/logs/turing.log
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 10
