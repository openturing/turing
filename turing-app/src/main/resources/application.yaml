# =============================================================================
# Turing ES — Application Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Turing
# ---------------------------------------------------------------------------
turing:
  # Master key for AES/GCM encryption of all stored provider API keys and store
  # credentials. MUST be supplied via the environment in production; the blank
  # default makes the production profile fail fast (T639 / §XXXVII.1). Outside
  # production an insecure dev fallback is used (warned once). Never commit a
  # real value here. Rotation: docs/operations/crypto-key-rotation.md
  ai.crypto.key: ${TURING_AI_CRYPTO_KEY:}
  allowedOrigins: http://localhost:4200,http://localhost:5173
  admin:
    # Headless bootstrap of the local `admin` password (docker run / CI), so a fresh
    # container is usable without going through the first-access setup screen.
    # Applied on startup ONLY while the password is still unset — it never
    # overwrites a password already configured, so restarts are a no-op. Minimum 6
    # characters (shorter values are ignored with a warning and the setup screen is
    # kept). Blank/unset (the default) = interactive setup, as before.
    password: ${TURING_ADMIN_PASSWORD:}
  # T642 / §XXXVII.4 — when false, ANY authenticated principal is granted
  # ROLE_ADMIN + every privilege (see TurCustomUserDetailsService /
  # TurAuthTokenHeaderFilter), which nullifies all ~240 method-level checks and
  # turns authentication into super-admin. The shipped default is now `true`
  # (enforce real per-user authorities; the seeded `admin` keeps full rights via
  # the Administrator group). Set to `false` only for a deliberately trusted
  # single-user deployment — a startup WARNING is logged when you do.
  permissions: true
  # The LLM-instance model picker's fallback catalog is served from the public
  # catalog API published by the dedicated openviglet/model-catalog repo. It is
  # remote-only (no bundled copy): the fetch is best-effort, runs off the boot path
  # on a TTL, and never blocks startup. Until the first successful fetch (or with
  # remote-enabled=false) the picker falls back to live vendor listing only.
  model-catalog:
    url: ${TURING_MODEL_CATALOG_URL:https://openviglet.github.io/model-catalog/catalog.json}
    remote-enabled: ${TURING_MODEL_CATALOG_REMOTE_ENABLED:true}
    refresh-initial-delay-ms: ${TURING_MODEL_CATALOG_REFRESH_INITIAL_DELAY_MS:8000}
    refresh-interval-ms: ${TURING_MODEL_CATALOG_REFRESH_INTERVAL_MS:21600000}
    # T777 / §LIII.1 — auto-seed & refresh the per-model price table (tur_llm_price)
    # from the catalog's indicative pricing on a TTL. Only CATALOG-sourced rows are
    # written; an operator's MANUAL (negotiated / hand-edited) rate is never
    # overwritten. Set enabled=false to keep the price table manual-only.
    price-sync:
      enabled: ${TURING_MODEL_CATALOG_PRICE_SYNC_ENABLED:true}
      initial-delay-ms: ${TURING_MODEL_CATALOG_PRICE_SYNC_INITIAL_DELAY_MS:15000}
      interval-ms: ${TURING_MODEL_CATALOG_PRICE_SYNC_INTERVAL_MS:21600000}
    # T788 / §LIII.4 — optional email when the catalog change feed affects a model
    # you use (removed / superseded / changed). Opt-in (default off) so no surprise
    # mail; the in-UI change-feed banner is always on. Deduped per notification set;
    # sends to the recipient configured in Global Settings.
    change-feed:
      email-enabled: ${TURING_MODEL_CATALOG_CHANGE_FEED_EMAIL_ENABLED:false}
      email-initial-delay-ms: ${TURING_MODEL_CATALOG_CHANGE_FEED_EMAIL_INITIAL_DELAY_MS:45000}
      email-interval-ms: ${TURING_MODEL_CATALOG_CHANGE_FEED_EMAIL_INTERVAL_MS:86400000}
  tenancy:
    enabled: false
    # T334 / §XIV.8.1 — shared secret for trusted server-to-server callers. When
    # set, a request carrying a matching `X-Turing-Internal-Token` header may
    # stamp `X-Turing-Tenant` to scope the call to an end user's tenant without
    # that user's membership (a suspended tenant still blocks). Leave empty (the
    # default) to disable; only share over a trusted internal network. Prefer
    # forwarding the end user's bearer token, which needs no token here.
    internal-token: ${TURING_TENANCY_INTERNAL_TOKEN:}
    # T336 / §XIV.8.3 — lifecycle close on identity deletion. A daily sweep
    # suspends (and, in SUSPEND_THEN_DELETE mode, later tears down via the T281
    # service) any personal tenant whose every member has been deleted/disabled
    # in Keycloak. Dormant unless enabled AND service-account creds are set; it
    # never acts when the IdP can't be queried (fail-safe). The creds need a
    # `realm-management` role that can read users (e.g. `view-users`).
    deprovision:
      enabled: ${TURING_TENANCY_DEPROVISION_ENABLED:false}
      cron: ${TURING_TENANCY_DEPROVISION_CRON:0 25 3 * * *}
      mode: ${TURING_TENANCY_DEPROVISION_MODE:SUSPEND_ONLY}
      delete-after-days: ${TURING_TENANCY_DEPROVISION_DELETE_AFTER_DAYS:30}
      keycloak-client-id: ${TURING_TENANCY_DEPROVISION_KC_CLIENT_ID:}
      keycloak-client-secret: ${TURING_TENANCY_DEPROVISION_KC_CLIENT_SECRET:}
    # T366 / §XIV.8.5 — grant ROLE_PLATFORM_ADMIN (cross-tenant console + GLOBAL
    # infra pool) from a Keycloak realm role. A principal whose token carries this
    # realm role in `realm_access.roles` becomes a platform admin. Blank disables
    # realm-role mapping. `admin-implies-platform-admin` is the product decision of
    # whether the bootstrap admin (`turing.keycloak-admin-id`) gets it implicitly;
    # default false = platform-admin must always be an explicit, assigned realm role.
    platform-admin-role: ${TURING_TENANCY_PLATFORM_ADMIN_ROLE:platform-admin}
    admin-implies-platform-admin: ${TURING_TENANCY_ADMIN_IMPLIES_PLATFORM_ADMIN:false}
  # T245 / §XIII — Turing as an MCP server. The endpoint itself is toggled by
  # spring.ai.mcp.server.enabled (below); this block carries the Turing-specific
  # governance on top of it. loopback-only is the T245 trust boundary: until the
  # T246 OAuth 2.1 resource-server gate lands, /mcp answers loopback requests
  # only. Leave it true for any remote deployment until auth is wired.
  mcp-server:
    loopback-only: true
    # T246 — when true, /mcp requires a valid Keycloak JWT bearer token
    # (spring.security.oauth2.resourceserver.jwt.*) and scopes tool execution to
    # the token's authorities. Default false keeps the T245 loopback-only dev
    # posture. A remote deployment sets require-auth=true + loopback-only=false.
    require-auth: false
    # T146 — public consumption surface: when true (with require-auth=true), /mcp
    # also accepts a Turing API key (TurDevToken) in the `Key` header, so external
    # MCP clients (Claude Desktop, Cursor, OpenAI Responses) can use a static key.
    # API-key principals are read-only; write tools still require an OAuth
    # mcp:write scope. Default false: OAuth is the only accepted credential.
    api-key-enabled: false
    # T253 — gated write/ingestion tools (index_document, deindex_document,
    # reindex_site). Default false: they are not even registered. When true they
    # appear but still require the mcp:write scope per call. Read-only by default.
    write-enabled: false
  # T1037 / §CVI.2 — Turing as an MCP *client*: the outbound path where an agent
  # calls a remote MCP server's tools. The other direction is mcp-server above.
  # Every value here is the code default, so writing the block changes nothing —
  # it exists because these knobs were reachable only from Javadoc before.
  #
  # A per-server URL/transport/credential is admin data, not configuration: it
  # lives on the MCP Server entity (/bento/mcp). This block is the deployment-wide
  # posture around it.
  mcp-client:
    # How long to wait for a remote MCP server to answer. Tool discovery runs on
    # the CHAT PATH — an agent's tools are resolved per turn — so this is paid by
    # every turn of every conversation on every agent holding an unreachable
    # server. It was a hardcoded 30s, which a user experiences as a chat that
    # stopped responding. Raise it for a slow-but-alive server behind a distant
    # hop; lower it on a local one.
    request-timeout: 10s
    # How long a server that just failed to connect is skipped before being tried
    # again. A failed client is dropped from the cache (a half-built one must not
    # be served to the next caller), so without this the next turn paid the whole
    # timeout again. The agent loses that server's tools either way. An admin edit
    # to the server's URL, transport or credential cancels the skip immediately,
    # so fixing a rotated token does not mean waiting this out. Set to 0s to
    # restore the legacy retry-every-turn behaviour.
    failure-backoff: 60s
    # T650 / §XXXVII.12 — SSRF guard on the outbound URL. When true, an MCP client
    # URL resolving to a private/loopback/link-local address is refused. Default
    # false because a legitimate MCP server often lives on an internal network;
    # turn on for an internet-only egress posture.
    block-private-urls: false
    # T650 / §XXXVII.12 — allowlist of permitted stdio `command` executables,
    # matched on the base name, case-insensitively (e.g. [npx, uvx, python]).
    # EMPTY means any command is allowed (legacy). Non-empty blocks arbitrary
    # local-process execution by configuration — a COMMAND-type MCP server whose
    # command is not listed is refused.
    allowed-stdio-commands: []
  # T1038 / §CVI.3 — the six blocks below had never appeared in this file: their
  # prefixes were declared in Java and discoverable only by reading it, which for
  # abuse control and guardrails meant the safety surface was folklore. Every
  # value written here is the code default, so the blocks change no behaviour.
  # Credentials are deliberately left as comments rather than empty keys — an
  # empty YAML value binds "" where the code expects null, and the two are not
  # always the same thing to a blank check.
  #
  # T641 / §XXXVII.3 — app-layer abuse controls for the anonymous public chat and
  # search surface. Those SN endpoints are permitAll by design, so without these a
  # loop of POST /api/sn/{site}/chat/conversation could drive unbounded LLM spend.
  # The rate limiter is ON by default; the USD ceiling is off because a spend cap
  # is deployment-specific.
  abuse:
    chat:
      rate-limit-enabled: true
      requests-per-minute-per-ip: 60
      requests-per-minute-per-session: 30
      window-seconds: 60
      # Hard month-to-date LLM spend ceiling (USD) for anonymous SN chat. When > 0
      # and reached, new anonymous conversations are refused and NO upstream LLM
      # call fires — a kill switch, unlike the soft per-agent budget gate.
      hard-monthly-cap-usd: 0
      # T647 / §XXXVII.9 — tool trust boundary. True (legacy) lets an anonymous
      # visitor's turn invoke the agent's tools. Set false so an untrusted visitor,
      # or an injection payload in retrieved content, cannot trigger tool execution
      # with system authority. Authenticated agent/persona chat is unaffected.
      anonymous-tools-enabled: true
      # T648 / §XXXVII.10 — input / DoS caps. Each <= 0 disables that one gate.
      max-upload-bytes: 10485760
      max-messages-per-turn: 100
      max-message-chars: 24000
      max-zip-entries: 5000
      max-zip-entry-bytes: 52428800
      max-zip-total-bytes: 262144000
  # T-guardrail / §XXXVII — answer-grounding guardrail: verifies a RAG answer is
  # actually grounded in the retrieved context (and screens it for unsafe content
  # / PII) before it reaches the user. Off by default: with enabled=false, or a
  # strategy resolving to NONE, the chat path is byte-for-byte unchanged. Fully
  # fail-open — any guardrail error degrades to "no verdict", never a blocked
  # answer.
  safety:
    guardrail:
      enabled: false
      # NONE | BEDROCK | OPENAI_MODERATION | MISTRAL_MODERATION. Parsed leniently;
      # an unknown value disables.
      strategy: NONE
      # False (default) delivers the answer and surfaces the verdict beside it as
      # a confidence signal. True replaces a flagged answer with blocked-message.
      block-on-violation: false
      blocked-message: "This answer could not be verified against the available sources."
      bedrock:
        guardrail-version: DRAFT
        region: us-east-1
        # guardrail-id: <id or ARN>   # blank leaves the adapter inert
        # access-key-id / secret-access-key: omit for the AWS default chain (IAM role)
      mistral:
        model: mistral-moderation-latest
        endpoint: https://api.mistral.ai/v1/moderations
        timeout-seconds: 30
        # api-key: ${MISTRAL_API_KEY}   # blank leaves the adapter inert
  # T740 / §XLIX — the Governed LLM Gateway (Block AZ): the OpenAI-compatible
  # inbound surface (/v1/chat/completions, /v1/embeddings, /v1/models). The
  # controllers are @ConditionalOnProperty on enabled, so while it is false the
  # endpoints do not exist at all. Turn it on to let any OpenAI-compatible client
  # point its base_url at Turing.
  gateway:
    enabled: false
    # T741 — require a virtual key (Authorization: Bearer sk-turing-...). Set false
    # only in a network-isolated deployment where /v1/* is reachable solely by
    # already-authenticated callers.
    require-virtual-key: true
    # T743 — the x-turing-cache: semantic response cache.
    cache-ttl-seconds: 300
    cache-max-entries: 1000
    # T746 — capture inbound gateway traffic as an eval dataset so production
    # traffic can be replayed through the graders. Off: capturing prompts and
    # answers is opt-in and admin-managed.
    capture-traffic: false
    capture-dataset-name: Gateway Traffic
  # T520 / §XXVIII.16 — which backend serves RAG passages. A deploy-time infra
  # choice, like storage above. BUILT_IN leaves the retrieval core byte-for-byte
  # unchanged; BEDROCK_KB plus a knowledge-base id routes retrieval at an AWS
  # Bedrock Knowledge Base instead.
  retrieval:
    backend: BUILT_IN
    bedrock-kb:
      region: us-east-1
      # knowledge-base-id: <kb id>   # blank falls back to the built-in backend
      # access-key-id / secret-access-key: omit for the AWS default chain (IAM role)
  # T1031 / §XX.18 — federating retrieval to an Adobe AEM Content AI index Turing
  # does not own. A site whose SE vendor is CONTENTAI queries Adobe's vector index
  # instead of one Turing filled, so a customer already paying the Content AI SKU
  # stops embedding the same published AEM content twice. Read-only by design:
  # every write, schema and lifecycle call on the plugin refuses by name.
  content-ai:
    # Off until a credential exists. With this false the plugin registers, reports
    # its capabilities and refuses to call Adobe.
    enabled: false
    # token: <bearer>     # Adobe Developer Console, "AEM Content AI" card
    # api-key: <x-api-key>  # the alternative the search endpoints accept
    # The endpoint is NOT here — it is the SE instance's endpoint URL, so a
    # per-tenant BYO-infra bucket keeps working. Adobe's is versioned and dated:
    # https://{bucket}.adobeaemcloud.com/adobe/experimental/aemcontentai-expires-20261231/contentAI
    #
    # contentSource.type: ACQUISITION (the API default), AEM_AUTHOR, AEM_PUBLISH or CUSTOM.
    source-type: ACQUISITION
    # Content source name per SN site; unmapped sites fall back to the
    # (site, locale) core name.
    # sources:
    #   my-site: content-ai-articles-index
    #
    # Compose Adobe's own hybrid shape — a composite OR over a vector arm and a
    # fulltext arm. false sends fulltext alone, which is the BM25 comparison.
    hybrid: true
    vector-boost: 1.0
    fulltext-boost: 1.0
    # vector-space / lexical-space: names from the source's IndexConfig; blank
    # uses Adobe's default space.
    #
    # Facet values per field (`size` on each termBuckets aggregate).
    facet-size: 10
    # Adobe paginates by opaque cursor with no offset, so page N costs N round
    # trips. Past this, the plugin returns an empty page carrying the true total.
    max-page-walk: 10
    timeout-seconds: 10
    # T1044 — matched chunks alongside each document, carried as TurSEResult
    # passages. An agent grounding through turingSearch.sn(...) then reads the
    # matched passage as the hit's `content` rather than a whole AEM page. Off by
    # default: it multiplies response size, and the passage becomes the `content`
    # an existing script may already read.
    include-chunks: false
  # Block AO / §XXXVIII — the source-engine migration importers (Elasticsearch
  # T657, Algolia T658): how a source index is read and pushed through the
  # existing import queue.
  migration:
    batch-size: 500
    timeout-seconds: 30
    # Hard cap on documents per run; 0 imports the whole index.
    max-documents: 0
    # Elasticsearch scroll keep-alive held open on the source cluster between pages.
    es-scroll-keep-alive: 1m
    # Documents sampled from the first page to detect multi-valued fields, since
    # neither an ES _mapping nor Algolia settings declare cardinality.
    sample-size: 20
  # T956 / §XIV.10.1 — Viglet AI, the managed LLM endpoint behind the onboarding
  # credit (Block J.10). Deployment-level on purpose: the point of the `viglet`
  # provider is that an operator never types an endpoint or a model name. These
  # exist so a Viglet-side staging environment can be pointed elsewhere.
  viglet-ai:
    base-url: https://llm.viglet.cloud/v1
    # The single opaque alias the managed endpoint serves. Naming the vendor model
    # would pin Turing to one vendor's price sheet.
    model-alias: viglet-fast
    # T957 — device-code pairing: the install posts to {pairing-base-url}/device/code
    # and polls /device/token until the credential arrives.
    pairing-base-url: https://llm.viglet.cloud/pair
    # T959 — where a quota refusal points the operator. Blank disables the paid
    # exit entirely; the refusal still states what ran out and offers their own key.
    upgrade-base-url: https://viglet.cloud/upgrade
    # upgrade-signing-secret: <hmac key>   # blank signs with the T957 pairing credential
  # T618 / §XXXIV.6 — bounds for the per-turn assembled-prompt capture store.
  # Capture itself is per-agent opt-in (TurAIAgent.promptCaptureEnabled); these
  # keep it from growing without limit — a per-conversation ring, a per-entry cap,
  # and a retention window swept on a schedule.
  prompt:
    capture:
      # Newest N turns kept per conversation; older ones pruned after each write.
      max-turns-per-conversation: 50
      # A serialized capture larger than this is skipped, so a runaway prompt
      # never lands a giant blob.
      max-bytes-per-entry: 262144
      # The scheduled sweep prunes captures older than this across every
      # conversation, bounding the store globally over time.
      retention-days: 30
      cleanup-cron: "0 40 3 * * *"
  # E.8 / §IX.9 — observability interop (opt-in, fail-open trace exports). Lock in
  # via capability, never via format: both are off by default and never disturb a
  # chat turn when the backend is slow or unreachable.
  # - spans (T129): emit the chat-pipeline stage timers as OpenTelemetry spans (via
  #   the micrometer-tracing OTel bridge), exported to any OTLP backend when
  #   OTEL_EXPORTER_OTLP_ENDPOINT is set. The LLM call already has its own span
  #   (turing.llm.calls); timer metrics are unaffected either way.
  # - langsmith (T128): mirror each completed chat turn as a run in a LangSmith
  #   project (POST {api-url}/runs/batch). Metadata-only by design (model, provider,
  #   tokens, cost, agent, stage) — no message content, to keep conversation PII out
  #   of a third-party trace store. A blank api-key is a no-op.
  observability:
    spans:
      enabled: false
    langsmith:
      enabled: false
      api-key: ${LANGSMITH_API_KEY:}
      api-url: https://api.smith.langchain.com
      project: turing
  keycloak: false
  keycloak-admin-id:
  authentication:
    thirdparty: true
    new-user: true
  url: http://localhost:2700
  open-browser: true
  jms.concurrency: 1-1
  solr:
    timeout: 30000
    cloud: false
    # When enabled=true and endpoint is set, Turing uses this endpoint directly
    # and the SE instance catalog becomes read-only (no new Solr instances can be
    # created from the UI/API). Leave enabled=false to keep the default JPA mode.
    enabled: false
    endpoint:
    commit:
      within: 10000
      enabled: false
  elasticsearch:
    timeout: 30000
  search:
    metrics.enabled: true
    cache:
      ttl:
        seconds: 86400000
      enabled: false
  storage:
    type: FILESYSTEM
    filesystem:
      path: ./store/assets
    minio:
      endpoint: ${TURING_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      # T652 / §XXXVII.14 — externalised. The previous committed value
      # (`admin` / `minha_senha_forte`) was a real-looking secret in source
      # (and in git history — rotate the MinIO root credentials and purge the
      # old value from history as a separate ops step). Only used when
      # storage.type=MINIO (default is FILESYSTEM). Dev defaults are MinIO's own
      # well-known placeholders; set the env vars for any real deployment.
      access-key: ${TURING_STORAGE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${TURING_STORAGE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${TURING_STORAGE_MINIO_BUCKET:turing-assets}
  code-interpreter:
    # Execution mode is chosen at runtime in Console -> Global Settings ->
    # Code Interpreter (NATIVE host subprocess, the default, or DOCKER). The
    # properties below only apply when the mode is DOCKER and are safe to
    # leave untouched on NATIVE deployments.
    docker:
      executable: docker        # Docker CLI binary (must be on PATH)
      network: none             # none = no egress; or a named docker network
      memory: 512m              # hard RAM cap per execution
      cpus: "1.0"               # CPU quota per execution
      pids-limit: 128           # max PIDs (fork-bomb containment)
      probe-timeout-seconds: 8  # timeout for the "Check Docker" availability probe
      # T239 — opt-in extra isolation (both off by default; the baseline T80
      # hardening of --cap-drop ALL + no-new-privileges + --read-only +
      # Docker's built-in seccomp always applies):
      runtime: ""               # OCI runtime; "runsc" = gVisor (must be installed on the host). Empty = host default (runc).
      seccomp-profile: ""       # host path to a tighter seccomp profile JSON. Empty = Docker's built-in default profile. Ignored under gVisor.
    native:
      # Per-execution CPU/RAM caps for the NATIVE host-subprocess path (Linux
      # only). DOCKER mode already caps via the container runtime, so these
      # apply only when the execution mode is NATIVE. Disabled by default to
      # preserve exact legacy behavior; enable to stop a runaway script (e.g.
      # `[x*x for x in range(10**9)]`) from exhausting host RAM before the
      # wall-clock timeout fires.
      limits:
        enabled: false          # opt-in; false = legacy (timeout is the only guard)
        memory-max: 1g          # hard RAM cap (prlimit --as / cgroup MemoryMax)
        cpu-seconds: 35         # CPU-time cap (prlimit --cpu); <=0 disables
        limiter: auto           # auto | prlimit | systemd-run | none
    warm-pool:
      # Pre-warmed interpreter pool for the NATIVE path (T82). Keeps a few host
      # Python interpreters booted-and-blocked so a frequently-invoked tool
      # skips the ~200ms cold boot each call. Workers are single-use (one
      # execution then exit — no cross-tenant state leak), refilled async.
      # NATIVE only; automatically bypassed in DOCKER mode and whenever the
      # native limits above are enabled (a running worker can't be wrapped by
      # prlimit/systemd-run). Opt-in; false = legacy cold-spawn-per-call.
      enabled: false
      size: 2                   # interpreters kept booted and ready
  git:
    server: false
  marketplace:
    enabled: true
    url: https://turing.viglet.org/marketplace/marketplace.json
  genai:
    reindex:
      # Number of documents indexed in parallel during a RAG reindex.
      # Embedding HTTP calls are I/O-bound, so a small fixed pool fully utilizes
      # the embedding API without saturating typical rate limits. Set to 1 to
      # force sequential indexing (useful for debugging or rate-limited APIs).
      parallel: 4
    # T791 / §LIV.2 (Block BF) — scheduled structured-feed pull ingester, the
    # "pull" side of ingestion for a Vectorless (Structured-Data) RAG knowledge
    # base (TurStructuredFeedIngestService). Off by default; with no sources it is
    # a no-op even when enabled. Each source GETs a remote JSON / NDJSON feed via
    # the T739 URL-fetch guard, optionally converges the SN-site field schema from
    # a field manifest, imports the records, and de-indexes vanished ids.
    # T793 / §LIV.4 (Block BF) — Vectorless (Structured-Data) RAG copilot
    # stuff-all mode: when the whole catalog fits the token budget (and doc cap),
    # the copilot skips NL→DSL retrieval and grounds the LLM on every row (still
    # cited). Self-gating by size — above either bound it falls back to filtered
    # retrieval — so it is safe to leave on.
    copilot:
      stuff-all-enabled: true
      stuff-all-token-budget: 40000
      stuff-all-max-docs: 1000
    structured-feed:
      enabled: false
      # Delay before the first run and fixed delay between runs (ms).
      initial-delay-ms: 30000
      interval-ms: 3600000
      # Safety cap on records mapped per source per run (0 = unlimited).
      max-records-per-source: 0
      # sources:
      #   - id: model-catalog
      #     site-name: model-catalog
      #     feed-url: https://openviglet.github.io/model-catalog/catalog.ndjson
      #     manifest-url: https://openviglet.github.io/model-catalog/query-manifest.json
      #     id-field: id
      #     locale: en_US
      #     # records-field: vendors   # only for a JSON-object envelope feed
      #     # flatten-nested: true     # T797 — flatten nested objects (pricing.inputPer1M -> pricing_inputPer1M)
      #     # provision: true          # T796 — auto-create the SN site at startup + set Vectorless mode + first ingest
      #     # se-instance-id:          # optional; blank defaults to an embedded Lucene SE instance (find-or-create)
    embedding:
      # In-process ONNX embedding runtime (TRANSFORMERS_LOCAL + HUGGINGFACE
      # providers). T656 owns remote artifact acquisition (TurOnnxModelDownloader)
      # instead of delegating to Spring AI's ResourceCacheService: adds retry/
      # backoff, an integrity check, a persistent cache, and an actionable error.
      # The large ONNX file (~90 MB) is a HuggingFace Git-LFS artifact that
      # 302-redirects to a separate CDN host; a cold cache + a network blip (or an
      # egress policy that reaches huggingface.co but not the CDN host) is what
      # left RAG without its embedding model.
      local:
        # Persistent cache directory for downloaded .onnx/tokenizer.json files.
        # Point at a mounted volume so a wiped/ephemeral environment (demo reset)
        # reuses the warm cache instead of re-downloading ~90 MB on every boot.
        # Blank falls back to store/turing-onnx-cache — the project-wide store/
        # dir (H2 db, assets, queue, logs) so the model cache persists next to
        # them (in Docker under the /app/store volume), not a volatile temp dir.
        cache-dir:
        # DJL model/engine cache (DJL backs the in-process ONNX runtime). Blank
        # sets DJL_CACHE_DIR to store/djl-cache unless the env var / system
        # property is already pinned. Matches the /app/store/djl-cache dir the
        # runtime image pre-creates.
        djl-cache-dir:
      download:
        # Bounded retry with exponential backoff on transient network failures.
        max-attempts: 4
        # Per-request timeout for the (potentially large) model download.
        timeout-seconds: 180
        # Base backoff between attempts; doubles each retry.
        initial-backoff-millis: 750
  chat:
    session:
      # Cookie name minted by the React SDK to identify a returning visitor.
      # Reused as the chat conversationId so the value also bounds how long a
      # conversation can be resumed without resetting flow state.
      cookie-name: TUR_SESSION
      # Cookie lifetime in seconds. Default: 30 days (2592000).
      ttl-seconds: 2592000
    analytics:
      # T237 — opt-in per-turn node-visit log. When true, the engine appends
      # the node each turn settles on to the conversation's path on
      # chat_flow_state and snapshots it onto chat_flow_submission at flow end,
      # enabling the path-aware funnel's per-node reached / drop-off counts.
      # Default false: no extra column writes, V1 funnel behaviour unchanged.
      node-visit-log:
        enabled: false
    # Note (post-T16): `turing.chat.inverted-harness.enabled` and
    # `turing.chat.judge-retry.enabled` no longer exist. The inverted
    # harness (advance before LLM, single LLM call, no regen) and the
    # single-shot judge (onJudgeReject as sole reject driver) are the
    # only paths. The flags were transitional during T9-T14 and were
    # removed in T16 along with the legacy code they gated.
  # ---------------------------------------------------------------------------
  # Resilience for outbound calls (LLM providers + search engines)
  # ---------------------------------------------------------------------------
  # Each group ("llm", "search-engine") has shared `defaults` and per-type
  # `overrides`. Null fields in an override fall back to defaults. Set
  # `turing.resilience.enabled: false` to bypass the entire pipeline globally.
  resilience:
    enabled: true
    llm:
      enabled: true
      defaults:
        retry:
          max-attempts: 3
          wait-duration: 1s
          exponential-backoff-multiplier: 2.0
          retry-on-exceptions:
            - java.io.IOException
            - java.net.SocketTimeoutException
        circuit-breaker:
          failure-rate-threshold: 50
          slow-call-rate-threshold: 80
          slow-call-duration-threshold: 30s
          sliding-window-size: 20
          minimum-number-of-calls: 10
          wait-duration-in-open-state: 30s
          permitted-number-of-calls-in-half-open-state: 3
        time-limiter:
          timeout-duration: 60s
          cancel-running-future: true
      overrides:
        openai:
          time-limiter:
            timeout-duration: 90s
        ollama:
          time-limiter:
            timeout-duration: 300s
        gemini:
          circuit-breaker:
            wait-duration-in-open-state: 60s
    search-engine:
      enabled: true
      defaults:
        retry:
          max-attempts: 3
          wait-duration: 500ms
          exponential-backoff-multiplier: 2.0
          retry-on-exceptions:
            - java.io.IOException
            - java.net.SocketTimeoutException
            - java.net.http.HttpTimeoutException
            - org.apache.solr.client.solrj.SolrServerException
            - com.viglet.turing.solr.TurSolrDocumentHandler$TurSolrBatchIndexException
        circuit-breaker:
          failure-rate-threshold: 50
          slow-call-duration-threshold: 5s
          sliding-window-size: 30
          minimum-number-of-calls: 20
          wait-duration-in-open-state: 15s
          permitted-number-of-calls-in-half-open-state: 5
        time-limiter:
          timeout-duration: 30s
          cancel-running-future: true
      overrides:
        lucene:
          # Embedded engine; loosen circuit breaker since failures are rare and local.
          circuit-breaker:
            minimum-number-of-calls: 50
          time-limiter:
            timeout-duration: 10s
  logging:
    engine: none        # none | mongodb | redis
    database: turingLog
    collection:
      server: server
      aem: aem
      indexing: indexing
      # Chat memory documents (one per conversationId) written by
      # TurChatMemoryService when the agent has chatMemoryEnabled=true.
      # Mongo: collection name. Redis: key prefix → "<chat>:<conversationId>".
      chat: chat
    purge:
      days: 30
  mongodb:
    enabled: false
    uri: mongodb://localhost:27017
  redis:
    enabled: false
    uri: redis://localhost:6379/0

# ---------------------------------------------------------------------------
# Spring
# ---------------------------------------------------------------------------
spring:
  datasource.hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 600000
    pool-name: TurConnectionPool
  jmx.enabled: true
  profiles:
    active: production
  # T245 / §XIII — Turing as an MCP server. OFF by default: when enabled=false
  # the Spring AI MCP server auto-configuration does not activate, there is no
  # /mcp endpoint, and the deployment is unchanged. Flip enabled=true to publish
  # the decorated Turing tool catalog over Streamable HTTP at /mcp. Keep
  # turing.mcp-server.loopback-only=true (above) until the T246 OAuth 2.1 gate
  # is wired for any non-loopback exposure.
  ai:
    mcp:
      server:
        enabled: false
        protocol: STREAMABLE
        name: turing-es
        version: 2026.3.1
        instructions: >-
          Viglet Turing ES — enterprise search intelligence. Use these tools to
          discover indexed sites, inspect their fields, and run semantic/hybrid
          searches over the customer's enterprise content, with citations.
  h2:
    console:
      enabled: false
      path: /h2
      settings:
        # T652 / §XXXVII.14 — was true, which (if the console were ever enabled)
        # would expose a passwordless `sa` remote DB console to other hosts. The
        # console stays off by default; if enabled for local debugging it now
        # answers loopback only.
        web-allow-others: false
  datasource:
    url: jdbc:h2:file:./store/db/turingDB;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: PUBLIC
  jpa:
    properties:
      hibernate:
        "[globally_quoted_identifiers]": true
        "[format_sql]": false
        "[enable_lazy_load_no_trans]": false
        "[generate_statistics]": false
      "[jakarta.persistence.sharedCache.mode]": ALL
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    mapper:
      "[DEFAULT_VIEW_INCLUSION]": true
    deserialization:
      # Jackson 3 enables FAIL_ON_NULL_FOR_PRIMITIVES by default (Jackson 2 had it
      # off). Restore the prior behavior so a request body that omits a read-only
      # primitive DTO component (e.g. TurKnowledgeBaseDto.microthesaurusCount)
      # deserializes to the primitive default instead of failing with a 400.
      "[FAIL_ON_NULL_FOR_PRIMITIVES]": false
  thymeleaf:
    mode: HTML
    check-template: true
    check-template-location: true
    prefix: classpath:public/
    suffix: .html
  artemis:
    mode: embedded
    broker-url: localhost:61616
    embedded:
      enabled: true
      persistent: true
      data-directory: store/queue
      queues: indexing.queue
    pool:
      max-connections: 10
  jms:
    template:
      default-destination: indexing.queue
  servlet:
    multipart:
      # T648 / §XXXVII.10 — was 1024MB, which let an anonymous slot-upload feed
      # ~1 GB into Tika + a vision call. Capped to a sane default; the anonymous
      # slot endpoints additionally enforce turing.abuse.chat.max-upload-bytes
      # (10 MB) BEFORE parsing. Raise this for a deployment that imports large
      # page/skill ZIPs, but keep it bounded.
      max-file-size: 64MB
      max-request-size: 64MB
      # Skip eager parsing so the integration proxy ({id}/** catch-all)
      # can forward multipart bodies via getInputStream() to Dumont without
      # the parts having been consumed. Endpoints that use @RequestPart still
      # work — Spring parses on demand at parameter binding time.
      resolve-lazily: true
  mvc:
    async:
      request-timeout: 3600000
  output:
    ansi:
      enabled: always
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    http.path: /graphql
    cors:
      allowed-origins: ${turing.allowedOrigins}
      allowed-methods: GET,POST
      allowed-headers: "*"

  # -------------------------------------------------------------------------
  # OAuth2 Social Login (uncomment to enable)
  # -------------------------------------------------------------------------
  # Redirect URI pattern: {baseUrl}/login/oauth2/code/{registrationId}
  # Example: http://localhost:2700/login/oauth2/code/google
  #
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #         github:
  #           client-id: ${GITHUB_CLIENT_ID}
  #           client-secret: ${GITHUB_CLIENT_SECRET}
  #         microsoft:
  #           client-id: ${MICROSOFT_CLIENT_ID}
  #           client-secret: ${MICROSOFT_CLIENT_SECRET}
  #           scope: openid,profile,email
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #         keycloak:
  #           client-id: ${KEYCLOAK_CLIENT_ID}
  #           client-secret: ${KEYCLOAK_CLIENT_SECRET}
  #           scope: openid
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #       provider:
  #         microsoft:
  #           issuer-uri: https://login.microsoftonline.com/common/v2.0
  #         keycloak:
  #           issuer-uri: http://localhost:8080/realms/demo

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: ${PORT:2700}
  servlet:
    session:
      cookie:
        name: TURJSESSIONID
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
    min-response-size: 2048
  tomcat:
    accesslog:
      enabled: false
      suffix: .log
      prefix: access_log
      file-date-format: .yyyy-MM-dd
      directory: logs
    basedir: store
    threads:
      max: 600
    max-swallow-size: 200MB
    max-http-form-post-size: 200MB
    maxHttpResponseHeaderSize: 800KB

# ---------------------------------------------------------------------------
# API Documentation
# ---------------------------------------------------------------------------
springdoc:
  pathsToMatch: /api/**
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Management & Observability
# ---------------------------------------------------------------------------
# Metrics: Prometheus scrape endpoint at /actuator/prometheus.
# Tracing: traces are exported to OTLP if OTEL_EXPORTER_OTLP_ENDPOINT is set;
#   sampling defaults to 10% of requests, override with
#   management.tracing.sampling.probability.
# Set turing.observability.tracing.enabled=false to disable spans entirely.
management:
  endpoints:
    web:
      exposure:
        # T649 / §XXXVII.11 — was "*", which exposed /actuator/env + /heapdump
        # (leaking turing.ai.crypto.key, datasource creds and provider keys) to
        # any authenticated principal. Only the endpoints that genuinely need
        # HTTP exposure are published now: health + info + the Prometheus scrape
        # (all permitAll in TurSecurityConfigProduction). env/heapdump/beans/
        # mappings/etc. are no longer reachable over HTTP at all — add one back
        # explicitly (it will fall under authenticated()) only if you need it.
        include: "health,info,prometheus"
  metrics:
    tags:
      application: turing-es
    distribution:
      percentiles-histogram:
        "[turing.llm.calls]": true
        "[turing.search.calls]": true
        # T32 / §IV.7 — emit histogram buckets so Grafana can compute p95/p99
        # via `histogram_quantile(...)` on the chat-pipeline timer (now
        # tagged with stage=chat.setup.{decrypt,model,flow,persona,tools,compose}
        # in addition to the parent chat.{total,setup,llm.call,post,advance,regen})
        # and on the per-turn T30 / T29 retrieval timers. Without these,
        # only `_count` + `_sum` are exposed and dashboards can chart
        # averages but not percentiles.
        "[turing.chat.pipeline]": true
        "[turing.chat.memory.retrieval]": true
        "[turing.chat.tool.prefilter]": true
  tracing:
    sampling:
      probability: 0.1
  observations:
    annotations:
      enabled: true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  config: classpath:logback-spring.xml
  level:
    org:
      springframework: INFO
      apache: INFO
      "[apache.activemq]": ERROR
    com:
      viglet: INFO
    dev:
      langchain4j: INFO
      ai4j:
        openai4j: INFO
  file:
    name: store/logs/turing.log
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 10
