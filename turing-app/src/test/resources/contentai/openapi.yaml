openapi: 3.0.3
info:
  title: Content AI APIs
  description: |
    API definitions for Content AI services. To configure a client to access these APIs, visit the Adobe Developer Console
    and add the "AEM Content AI" card to your project.

    **Note:** These endpoints replace the previous APIs. For documentation on the legacy endpoints, please visit [API documentation](https://developer.adobe.com/experience-cloud/experience-manager-apis/api/experimental/contentai-legacy/)

    `Note : The use of these APIs is subject to co-innovation arrangements with Adobe or licensing once available for public use. Please contact your Adobe representative for more details.`
  version: 2026.07-experimental
servers:
  - url: https://{bucket}.adobeaemcloud.com/adobe/experimental/aemcontentai-expires-20261231/contentAI
    variables:
      bucket:
        default: ''
        description: The bucket to use for this request, e.g. author-p12345-e123456
security:
  - BearerAuth: []
tags:
  - name: Content Sources API
    description: |
      The `Content Sources API` provides a unified view and lifecycle management for all searchable
      content managed by Content AI.

      **Content Source Types**:
      * **AEM_AUTHOR**: Content sourced from an AEM Author instance (pre-publication, draft content). Surfaces automatically; no lifecycle management required.
      * **AEM_PUBLISH**: Content sourced from an AEM Publish instance (live, published content). Surfaces automatically; no lifecycle management required.
      * **ACQUISITION**: Content acquired using the Content AI acquisition service. Lifecycle is managed through
        the `/content-sources/acquisition` endpoints. Removal is performed by archiving (PATCH with
        `acquisitionConfig.status: ARCHIVED`) — content is retained for a grace period and then deleted by the system.
      * **CUSTOM**: Content pushed directly by your systems via direct index ingestion.

      **Key Features**:
      * **Unified Discovery**: `GET /content-sources` lists all sources regardless of type — a single
        consistent view across all Content AI-powered features.
      * **Typed Paths**: Operations specific to a particular type of content source are grouped under
        `/content-sources/{content-source type}`. For instance, acquisition-specific operations (runs,
        archiving) are grouped under `/content-sources/acquisition`, making the type self-evident from the URL.
      * **Search Metadata**: Each content source exposes its available spaces, searchable fields, and
        filterable fields — everything needed to construct effective search queries.
  - name: Discovery API
    description: |
      The `Discovery API` provides tooling to probe and validate a target site's sitemap
      availability before creating an acquisition source.
  - name: AI Search API
    description: |
      The `AI Search API` enables powerful retrieval of content from any content source.
      It supports fulltext, semantic, and hybrid (composed) queries, with flexible filtering
      and cursor-based pagination for navigating large result sets.

      **Key Features**:
      * **Multiple Query Types**:
        Supports `semantic`, `fulltext`, and `filter` queries individually or in combination,
        allowing retrieval by meaning, keywords, or structured criteria.

      * **Query Composition**:
        Enables hybrid searches by composing multiple queries — such as combining filters with
        fulltext and vector searches — for highly precise and relevant results.

      * **Flexible Filtering**:
        Define filter groups, apply filters standalone, or combine them as pre-filters within
        vector or fulltext queries for targeted results.

      * **Cursor-Based Pagination**:
        Efficiently navigate large result sets and sort results as needed (by score, timestamp, etc).

      * **Vector Query Enhancements**:
        For semantic queries, supports retrieval of both original documents and chunked
        (subdocument) representations for richer result detail.
  - name: Generative Search API
    description: |
      The Generative Search API provides generative search over content sources registered in the system.

      Users can use this API to submit questions and get AI generated answers that are grounded in the knowledge derived from the provided content-source. 
      There are 2 response modes that the users can choose from - blocking (synchronous) and streaming (SSE).
paths:
  /content-sources:
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      operationId: listContentSources
      summary: List content sources
      description: |
        Retrieve a paginated list of all content sources available for the current tenant.
        Returns sources across all content source types (AEM_AUTHOR, AEM_PUBLISH, ACQUISITION, CUSTOM).
        Use the `type` filter to restrict results to a specific type.

        Note: only acquisition-type sources can be retrieved individually (via
        `GET /content-sources/acquisition/{name}`). AEM_AUTHOR, AEM_PUBLISH, and Custom sources
        surface automatically and are accessible through this list endpoint only.
      parameters:
        - $ref: '#/components/parameters/if-none-match'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: type
          in: query
          required: false
          description: Filter content sources by type.
          schema:
            $ref: '#/components/schemas/ContentSourceType'
      responses:
        '200':
          description: Paginated list of content sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSourceListPage'
              examples:
                content sources:
                  $ref: '#/components/examples/list-content-sources-response'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/acquisition:
    post:
      security:
        - BearerAuth: []
      operationId: createAcquisitionContentSource
      summary: Create an acquisition content source
      description: |
        Creates and validates a new acquisition-managed content source. The crawler will begin
        running on the configured schedule (if enabled), or when an immediate run is triggered
        via `POST /content-sources/acquisition/{name}/runs`.
      requestBody:
        description: Acquisition content source configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAcquisitionContentSourceRequest'
            examples:
              create acquisition source:
                $ref: '#/components/examples/create-acquisition-source-request'
      responses:
        '201':
          description: Acquisition content source created.
          headers:
            Location:
              description: URI of the created acquisition content source.
              schema:
                type: string
                format: uri
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionContentSource'
              examples:
                acquisition source:
                  $ref: '#/components/examples/acquisition-source-response'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/422_UnprocessableEntity'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      operationId: listAcquisitionContentSources
      summary: List acquisition content sources
      description: |
        Retrieve a paginated list of all acquisition-managed content sources for the current tenant.
        Equivalent to `GET /content-sources?type=ACQUISITION` but returns the full
        `acquisitionConfig` on each item.
        Read operations support both IMS Bearer token (`BearerAuth`) and API key (`ApiKeyAuth`)
        authentication, consistent with the other read operations in this API.
      parameters:
        - $ref: '#/components/parameters/if-none-match'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          required: false
          description: Filter by acquisition status.
          schema:
            $ref: '#/components/schemas/AcquisitionStatus'
      responses:
        '200':
          description: Paginated list of acquisition content sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionContentSourceListPage'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/acquisition/{name}:
    description: |
      Operations on a single acquisition-managed content source identified by `{name}`.

      **Deletion**: There is no `DELETE` verb on this path. Removal is performed via a
      soft-delete: PATCH `acquisitionConfig.status` to `ARCHIVED`. The system will compute
      `deletesAt` and schedule deletion after a grace period. This design allows callers
      to observe the archived state and confirm before content is permanently removed.
    parameters:
      - $ref: '#/components/parameters/contentSourceId'
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      operationId: getAcquisitionContentSource
      summary: Get an acquisition content source
      description: |
        Retrieve a single acquisition-managed content source by name, including its full
        `acquisitionConfig`, available spaces, and searchable fields.
      parameters:
        - $ref: '#/components/parameters/if-none-match'
      responses:
        '200':
          description: Acquisition content source details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionContentSource'
              examples:
                acquisition source:
                  $ref: '#/components/examples/acquisition-source-response'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
    put:
      security:
        - BearerAuth: []
      operationId: updateAcquisitionContentSource
      summary: Update an acquisition content source
      description: |
        Perform a full replacement update of an acquisition content source.
        All mutable fields are replaced with the values provided. Fields not included in the request
        body are cleared to their defaults.

        The `name` is immutable and cannot be changed. To rename, delete and recreate.

        Configuration changes take effect on the next acquisition run; see
        `GET /content-sources/acquisition/{name}/runs/latest` for the most recent run's status.
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        description: Updated acquisition content source configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAcquisitionContentSourceRequest'
      responses:
        '200':
          description: Updated acquisition content source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionContentSource'
              examples:
                acquisition source:
                  $ref: '#/components/examples/acquisition-source-response'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/422_UnprocessableEntity'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
    patch:
      security:
        - BearerAuth: []
      operationId: patchAcquisitionContentSource
      summary: Partially update an acquisition content source
      description: |
        Apply a partial update (JSON Merge Patch, RFC 7396) to an acquisition content source.
        Only the fields provided in the request body are modified; all others retain their current values.

        To archive a content source and stop future crawls, set `acquisitionConfig.status` to `ARCHIVED`.
        The system will compute and set `deletesAt` automatically.

        Configuration changes take effect on the next acquisition run; see
        `GET /content-sources/acquisition/{name}/runs/latest` for the most recent run's status.
      parameters:
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        description: Partial acquisition content source update.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchAcquisitionContentSourceRequest'
      responses:
        '200':
          description: Updated acquisition content source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionContentSource'
              examples:
                acquisition source:
                  $ref: '#/components/examples/acquisition-source-response'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '412':
          $ref: '#/components/responses/412_PreconditionFailed'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/422_UnprocessableEntity'
        '428':
          $ref: '#/components/responses/428_PreconditionRequired'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/acquisition/{name}/runs:
    parameters:
      - $ref: '#/components/parameters/contentSourceId'
    post:
      security:
        - BearerAuth: []
      operationId: triggerAcquisitionRun
      summary: Trigger an acquisition run
      description: |
        Immediately trigger a crawl run for an acquisition content source, outside of its
        configured schedule. The run will be queued and start as soon as a crawler slot is available.
        Returns 409 if an acquisition run for this source is already in progress — concurrent runs
        are not permitted. Wait for the current run to reach a terminal state (`COMPLETED`,
        `COMPLETED_WITH_ERRORS`, or `FAILED`) before triggering another.
      responses:
        '202':
          description: Run accepted and queued. Poll the URI in the `Location` header for status.
          headers:
            Location:
              description: |
                URI of the latest-run resource for this acquisition. Clients SHOULD poll this
                URI to track the run's progress.
                Note: this URI always reflects the most recent run. If a new run is triggered
                while polling, the response will silently shift to that run's state. The 409
                on concurrent `POST /runs` guarantees at most one run per source at a time,
                bounding the window in which this shift can occur.
              schema:
                type: string
                format: uri
            Retry-After:
              description: Suggested polling interval, in seconds.
              schema:
                type: integer
                format: int32
                minimum: 1
                example: 30
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionRun'
              examples:
                run queued:
                  $ref: '#/components/examples/acquisition-run-queued-response'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '409':
          $ref: '#/components/responses/409_Conflict'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/acquisition/{name}/runs/latest:
    parameters:
      - $ref: '#/components/parameters/contentSourceId'
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      operationId: getLatestAcquisitionRun
      summary: Get the latest acquisition run
      description: |
        Retrieve the status and outcome of the most recent crawl run for an acquisition content source.
        Use this to monitor progress after triggering a manual run or to check the last scheduled run.
        Returns 204 if no acquisition run has been triggered yet for this source. Clients in the 204
        state cannot use conditional GET (`If-None-Match`) until they receive a 200 response and
        record its ETag.
      parameters:
        - $ref: '#/components/parameters/if-none-match'
      responses:
        '200':
          description: Latest run details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionRun'
              examples:
                latest run:
                  $ref: '#/components/examples/acquisition-run-response'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '204':
          $ref: '#/components/responses/204_NoContent'
        '304':
          $ref: '#/components/responses/304_NotModified'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/aem-author:
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      x-adobe-experimental: true
      operationId: listAemAuthorContentSources
      summary: List AEM Author content sources
      description: |
        Retrieve a paginated list of AEM Author content sources.

        <table><tbody style="border-color: silver; border-style: outset; padding: 5px">
          <tr>
            <td bgcolor="powderblue">
              <strong>This API is currently in Experimental.</strong>
            </td>
          </tr>
          <tr>
            <td>
              Click <a href="https://developer.adobe.com/experience-cloud/experience-manager-apis/guides/how-to/#experimental-apis">here</a> to learn more about experimental APIs.
            </td>
          </tr>
        </tbody></table>
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of AEM content sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AemAuthorContentSourceListPage'
          headers:
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/aem-publish:
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      x-adobe-experimental: true
      operationId: listAemPublishContentSources
      summary: List AEM Publish content sources
      description: |
        Retrieve a paginated list of AEM Publish content sources.

        <table><tbody style="border-color: silver; border-style: outset; padding: 5px">
          <tr>
            <td bgcolor="powderblue">
              <strong>This API is currently in Experimental.</strong>
            </td>
          </tr>
          <tr>
            <td>
              Click <a href="https://developer.adobe.com/experience-cloud/experience-manager-apis/guides/how-to/#experimental-apis">here</a> to learn more about experimental APIs.
            </td>
          </tr>
        </tbody></table>
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated list of AEM content sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AemPublishContentSourceListPage'
          headers:
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/aem-author/{source}:
    parameters:
      - name: source
        in: path
        required: true
        description: Name of the AEM content source.
        schema:
          type: string
    get:
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      x-adobe-experimental: true
      operationId: getAemAuthorContentSource
      summary: Get AEM Author content source
      description: |
        Retrieve an AEM Author content source.

        <table><tbody style="border-color: silver; border-style: outset; padding: 5px">
          <tr>
            <td bgcolor="powderblue">
              <strong>This API is currently in Experimental.</strong>
            </td>
          </tr>
          <tr>
            <td>
              Click <a href="https://developer.adobe.com/experience-cloud/experience-manager-apis/guides/how-to/#experimental-apis">here</a> to learn more about experimental APIs.
            </td>
          </tr>
        </tbody></table>
      responses:
        '200':
          description: The AEM content source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AemAuthorContentSource'
          headers:
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '406':
          $ref: '#/components/responses/406_Unacceptable'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
        - Content Sources API
  /content-sources/aem-author/{source}/access:
    parameters:
      - name: source
        in: path
        required: true
        description: Name of the AEM content source.
        schema:
          type: string
    put:
      security:
        - BearerAuth: []
      x-adobe-experimental: true
      operationId: setAemAuthorContentSourceAccess
      summary: Set AEM Author content source access
      description: |
        Set an AEM Author content source's access. Setting `public` to `true` marks the content
        source as public and searchable, making all of its content searchable. Setting it to `false`
        restricts the source and excludes it from search.

        <table><tbody style="border-color: silver; border-style: outset; padding: 5px">
          <tr>
            <td bgcolor="powderblue">
              <strong>This API is currently in Experimental.</strong>
            </td>
          </tr>
          <tr>
            <td>
              Click <a href="https://developer.adobe.com/experience-cloud/experience-manager-apis/guides/how-to/#experimental-apis">here</a> to learn more about experimental APIs.
            </td>
          </tr>
        </tbody></table>
      requestBody:
        description: AEM content source access to set.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexAccess'
      responses:
        '204':
          description: AEM content source access set.
          headers:
            Sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400_BadRequest'
        '401':
          $ref: '#/components/responses/401_Unauthorized'
        '403':
          $ref: '#/components/responses/403_Forbidden'
        '404':
          $ref: '#/components/responses/404_NotFound'
        '415':
          $ref: '#/components/responses/415_UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/500_InternalServerError'
        '503':
          $ref: '#/components/responses/503_ServiceUnavailable'
      tags:
