    search-001:
      description: This example demonstrates query composition with vector and fulltext queries. It combines a vector search for the phrase "What are the benefits of electric cars" with a fulltext search for the word "recycled". The queries are executed under OR operator which means results from both the queries would be returned based on score for each document.
      value:
        contentSource:
          name: content-ai-articles-index
        query:
          type: composite
          operator: OR
          queries:
            - type: vector
              text: What are the benefits of electric cars
              options:
                numCandidates: 3
                boost: 1
            - type: fulltext
              text: recycled
              options:
                lexicalSpaceSelection:
                  space: fulltext
                boost: 1.5
        queryOptions:
          pagination:
            limit: 1
          sort:
            - orderBy: width asc
              lexicalSpaceSelection:
                space: fulltext-title-description-concat
            - orderBy: height desc
              lexicalSpaceSelection:
                space: semantic-search-title
    search-002:
      description: This example demonstrates a vector search query. The query retrieves results based on semantic similarity. The results also include the chunks of the original source document.
      value:
        contentSource:
          name: content-ai-articles-index
        query:
          type: vector
          text: What are the benefits of electric cars
          options:
            vectorSpaceSelection:
              space: semantic
            numCandidates: 3
            boost: 1
            chunks:
              includeInResponse: true
              scoreMode: MAX
        queryOptions:
          pagination:
            limit: 1
    search-003:
      description: |-
        This example demonstrates a filter query. The query retrieves results based on specific filter criteria. The filter criteria includes a filter group composed of 2 filters over an `OR` condition. Filter 1 again is a filter group with 4 filters over an `AND` condition, four conditions are:  
          1. string equality filter to filter documents where the title field is equal to "How Self-Driving Cars Work".  
          2. number filter checking a GTE condition to filter documents where the width field is greater than or equal to 2.  
          3. InFilter to filter documents where the tags field contains either "electric" or "autonomous".  
          4. prefix filter to filter documents where the author field starts with "joh".  

        Filter 2 is an exists filter checking for the existence of a field. These translates to `(title = "How Self-Driving Cars Work" AND width >= 2 AND (tags = "electric" OR tags = "autonomous") AND author LIKE "joh%") OR (description EXISTS)`.
      value:
        contentSource:
          name: content-ai-articles-index
        query:
          type: filter
          filter:
            filterComponent:
              type: FilterGroup
              filters:
                - type: FilterGroup
                  filters:
                    - type: StringFilter
                      field: title
                      value: How Self-Driving Cars Work
                      operator: EQ
                    - type: NumberFilter
                      field: width
                      value: 2
                      operator: GTE
                    - type: InFilter
                      field: tags
                      values:
                        - electric
                        - autonomous
                    - type: PrefixFilter
                      field: author
                      value: joh
                  operator: AND
                - type: ExistsFilter
                  field: description
              operator: OR
          options:
            lexicalSpaceSelection:
              space: fulltext
            boost: 1
        queryOptions:
          pagination:
            limit: 1
