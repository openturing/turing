      x-adobe-experimental: true
      operationId: previewDiscovery
      summary: Probe a URL for sitemaps
      description: |
        Probe a base URL to discover which sitemaps are available (via `robots.txt` or
        well-known conventions) before creating an acquisition source.
        Use this during the setup wizard to validate site coverage and confirm sitemap availability.

        The probe runs synchronously and the result is ephemeral — it is not persisted
        and cannot be retrieved via a follow-up GET. The server enforces a wall-clock budget
        (well under 10 seconds); probes not completed within that budget produce a `PROBE_TIMEOUT`
        or `PARTIAL` outcome in the `status` field.

