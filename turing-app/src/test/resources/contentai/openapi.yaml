      responses:
        '200':
          description: |
            Server-Sent Events stream containing `data` object with:
            - `type="START"` — initial event with query
            - `type="STREAMING"` — partial answer chunks
            - `type="END"` — final result with links
            - `type="ERROR"` — error message in `result`
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of Server-Sent Events where each event contains:
                  - event: "message"
                  - data: JSON-serialized result object
              examples:
