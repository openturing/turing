        - ApiKeyAuth: []
      operationId: genSearchStreamContentSource
      summary: Execute Generative Search Stream on a Content Source
      description: |
        Submit a streaming generative query against a named content source via Server-Sent Events (SSE).
      requestBody:
        description: Content source generative search request
        required: true
        content:
          application/json:
            schema:
