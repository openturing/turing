# Test-classpath overrides applied to every @SpringBootTest (additive on top of
# the main application.yaml — properties win on conflicts).
#
# T622 — disable the demo self-provisioning ApplicationRunners in tests. In a
# developer environment where OPENAI_API_KEY is present these would otherwise
# fire on context startup: the default-LLM runner would create a default agent,
# and the default-RAG runner would then DOWNLOAD an ONNX embedding model and
# reindex every SN site into a vector store. Both must stay off so full-context
# tests remain hermetic, offline and fast.
turing.startup.default-llm.enabled=false
turing.startup.default-rag.enabled=false

# T639 / §XXXVII.1 — the main application.yaml activates the `production` profile,
# under which a blank or known-sample crypto key now fails fast. Tests boot under
# that profile, so supply a valid (non-sentinel) master key here to keep secret
# encryption working. This value is test-only and never used in a real deployment.
turing.ai.crypto.key=turing-integration-test-master-key-2f9c

# T641 / §XXXVII.3 — disable the anonymous-chat rate limiter in tests so an IT
# that fires many search/chat calls from one IP/session is never throttled. The
# limiter is covered directly by TurFixedWindowRateLimiterTest.
turing.abuse.chat.rate-limit-enabled=false

# T642 / §XXXVII.4 — the shipped production default flipped to `permissions: true`
# (authn is no longer super-admin). Full-context ITs authenticate as the seeded
# admin / run service-level flows and have always relied on the permissive
# "everyone is admin" mode; pin it here to keep that behavior so no IT needs
# re-auth wiring. Production stays secure-by-default.
turing.permissions=false

# T762 — the LLM model catalog refreshes from the public endpoint
# (turing.viglet.org/models/catalog.json) ~8s after context start. Disable the
# remote fetch in tests so full-context ITs stay hermetic/offline and never make
# a real HTTP call; the bundled catalog (loaded at startup) is used. The remote
# parse path is covered directly by TurLlmModelCatalogTest.
turing.model-catalog.remote-enabled=false
