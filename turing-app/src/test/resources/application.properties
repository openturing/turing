# Test-classpath overrides applied to every @SpringBootTest (additive on top of
# the main application.yaml — properties win on conflicts).
#
# T622 — disable the demo self-provisioning ApplicationRunners in tests. In a
# developer environment where OPENAI_API_KEY is present these would otherwise
# fire on context startup: the default-LLM runner would create a default agent,
# and the default-RAG runner would then DOWNLOAD an ONNX embedding model and
# reindex every SN site into a vector store. Both must stay off so full-context
# tests remain hermetic, offline and fast.
turing.startup.default-llm.enabled=false
turing.startup.default-rag.enabled=false
