name: Dependency Audit

# T654 / §XXXVII.16 — checks the frontend dependency tree for high-severity
# advisories. The Maven side is covered by the weekly Dependabot `maven` block
# (.github/dependabot.yml); add an OWASP dependency-check step here if a hard
# Maven gate is later required.
#
# **On demand only** (T929). This header used to describe pull-request and
# weekly-schedule runs, which 24a848332e removed along with every other automatic
# trigger; the sentence outlived the config by long enough that T922/T924 read it
# as evidence the state was accidental and had to be reverted (T928). Two things
# would have to be true before a `pull_request` trigger belongs here: the decision
# to run CI automatically at all, and a green audit. The second holds now — T927
# remediated seven advisories and recorded the eighth as unreachable, so this
# exits 0.

on:
  workflow_dispatch:

jobs:
  pnpm-audit:
    name: pnpm audit (frontend, fail on high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # T933 — an override is a claim that no copy below a floor reaches anyone,
      # and pnpm never checks it: two js-yaml overrides installed clean while the
      # vulnerable version stayed in the tree. This runs before the audit because
      # a remediation that is not in force is why the audit would find something.
      - name: Overrides are in force
        working-directory: frontend
        run: pnpm run check:overrides

      # T1023 — the release-age waiver list answers on the first rule whose
      # package name matches, so a second line for a name already listed waives
      # nothing. `pnpm add` writes exactly that when it upgrades a package
      # already in the list, and the install that writes it succeeds: the entry
      # is unreachable rather than wrong, and the refusal lands on some later
      # install. This runs beside the overrides check for the same reason — both
      # are config claiming a thing pnpm never verifies.
      - name: Release-age waivers are reachable
        working-directory: frontend
        run: pnpm run check:waivers

      # Fail on any high/critical advisory. Known transitive lows/mediums are
      # tracked by Dependabot. The `overrides` block in frontend/pnpm-workspace.yaml
      # remediates the open highs, and `auditConfig.ignoreGhsas` records the two
      # accepted ones (two xlsx parse paths and react-router RSC, all unreachable).
      #
      # T927 closed the standing debt: seven advisories took a capped floor, and
      # react-router's RSC-mode CSRF is recorded as unreachable (the RSC runtime is
      # not installed) rather than paid for with a breaking major across 220 files.
      # This step exits 0, so it is now a gate that would mean something.
      - name: pnpm audit (high+)
        working-directory: frontend
        run: pnpm audit --audit-level high
