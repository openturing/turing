name: Dependency Audit

# T654 / §XXXVII.16 — checks the frontend dependency tree for high-severity
# advisories. The Maven side is covered by the weekly Dependabot `maven` block
# (.github/dependabot.yml); add an OWASP dependency-check step here if a hard
# Maven gate is later required.
#
# **On demand only** (T929). This header used to describe pull-request and
# weekly-schedule runs, which 24a848332e removed along with every other automatic
# trigger; the sentence outlived the config by long enough that T922/T924 read it
# as evidence the state was accidental and had to be reverted (T928). Two things
# would have to be true before a `pull_request` trigger belongs here: the decision
# to run CI automatically at all, and T927 — `pnpm audit --audit-level high`
# exits 1 today on ten open advisories, so the gate would be red before any change
# was made.

on:
  workflow_dispatch:

jobs:
  pnpm-audit:
    name: pnpm audit (frontend, fail on high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # Fail the build on any high/critical advisory. Known transitive lows/
      # mediums are tracked by Dependabot; a NEW high blocks the merge. The
      # pnpm.overrides in frontend/package.json remediate the currently-open
      # highs (undici, xlsx via the SheetJS CDN patched build).
      - name: pnpm audit (high+)
        working-directory: frontend
        run: pnpm audit --audit-level high
