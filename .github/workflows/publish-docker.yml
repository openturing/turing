# Builds the Viglet Turing ES Docker image from the root Dockerfile and pushes
# it to the GitHub Container Registry (ghcr.io). The Dockerfile is multi-stage
# and self-contained (it clones + builds the source itself), so this workflow
# only needs Docker Buildx — no JDK/Node/Maven setup. For more information see:
# https://docs.github.com/en/actions/publishing-packages/publishing-docker-images

name: Publish Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Package name = last path segment → ghcr.io/openviglet/turing
  IMAGE_NAME: openviglet/turing

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve project version
        id: version
        run: echo "version=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
          # Link the package to the public openviglet/turing-ce repo instead of
          # the (private) repo that runs the workflow.
          labels: |
            org.opencontainers.image.source=https://github.com/openviglet/turing-ce
            org.opencontainers.image.url=https://github.com/openviglet/turing-ce
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            REPO_BRANCH=${{ github.ref_name }}
            CACHE_BUST=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
