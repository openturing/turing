name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook:react-sdk
        env:
          STORYBOOK_BASE: /react-sdk/

      - name: Build marketing site (root)
        working-directory: frontend
        run: pnpm run build:site
        env:
          # Wire the hero search + cited-chat demos to the public read-only demo
          # instance so they are genuinely LIVE in production (Block AB T478),
          # grounded in Turing's own docs seed (T483 dogfood). Without these the
          # deployed widgets silently fall back to scripted/sample data.
          VITE_TURING_DEMO_URL: https://turing-demo.viglet.org
          VITE_TURING_DEMO_SITE: turing-docs

      - name: Package Marketplace examples
        working-directory: frontend
        run: pnpm run package:marketplace

      - name: Assemble site
        run: |
          # Marketing site (React/Vite) at the root — includes index.html,
          # hashed assets and the static files from apps/site/public
          # (robots.txt, sitemap.xml, llms.txt, favicons).
          mkdir -p _site
          cp -r frontend/apps/site/dist/* _site/

          # Storybook
          mkdir -p _site/react-sdk
          cp -r frontend/packages/react-sdk/storybook-static/* _site/react-sdk/

          # Marketplace manifest
          mkdir -p _site/marketplace
          cp frontend/apps/marketplace/marketplace.json _site/marketplace/

          # Per-project artifacts + marketing docs
          for app_dir in frontend/apps/marketplace/*/; do
            project=$(basename "$app_dir")
            mkdir -p "_site/marketplace/$project"
            cp "$app_dir"*.zip                     "_site/marketplace/$project/" 2>/dev/null || true
            cp "$app_dir"dist/turing-manifest.json "_site/marketplace/$project/" 2>/dev/null || true

            # Marketing README + landing page live outside the workspace, in turing-marketplace/
            legacy="turing-marketplace/$project"
            [ -f "$legacy/index.html" ] && cp "$legacy/index.html" "_site/marketplace/$project/"
            if [ -f "$legacy/README.md" ]; then
              cp "$legacy/README.md" "_site/marketplace/$project/"
            else
              cp "$app_dir/README.md" "_site/marketplace/$project/" 2>/dev/null || true
            fi
          done

      - name: Deploy to openviglet/turing-ce (github-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PKG_TOKEN }}
          external_repository: openviglet/turing-ce
          publish_branch: github-pages
          publish_dir: ./_site
          # Persist the custom domain across deploys. Each publish overwrites the
          # github-pages branch; without a CNAME in the published root, GitHub
          # Pages drops the custom domain and it has to be re-added by hand.
          cname: turing.viglet.org
