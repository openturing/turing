name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # ── Storybook ──
      - name: Build Storybook
        working-directory: turing-js-sdk/turing-react-sdk
        run: npm install --no-audit --no-fund && npx storybook build --output-dir storybook-static
        env:
          STORYBOOK_BASE: /react-sdk/

      # ── Marketplace ──
      - name: Build Marketplace examples
        run: |
          for dir in turing-examples/*/app; do
            project=$(basename "$(dirname "$dir")")
            echo "::group::Building $project"
            (cd "$dir" && npm run package)
            echo "::endgroup::"
          done

      # ── Assemble site ──
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/react-sdk
          cp -r turing-js-sdk/turing-react-sdk/storybook-static/* _site/react-sdk/

          for dir in turing-examples/*/; do
            project=$(basename "$dir")
            mkdir -p "_site/marketplace/$project"
            cp "$dir"app/*.zip "_site/marketplace/$project/"
            cp "$dir"app/dist/turing-manifest.json "_site/marketplace/$project/" 2>/dev/null || true
            cp "$dir"app/README.md "_site/marketplace/$project/" 2>/dev/null || true
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
