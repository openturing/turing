name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Regenerate package-lock on the runner to resolve platform-specific
      # native optional deps (e.g. @tailwindcss/oxide-linux-x64-gnu) — avoids
      # npm/cli#4828 with workspaces + committed Windows lockfile.
      - name: Install workspace deps
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook:react-sdk
        env:
          STORYBOOK_BASE: /react-sdk/

      - name: Package Marketplace examples
        working-directory: frontend
        run: npm run package:marketplace

      - name: Assemble site
        run: |
          # Storybook
          mkdir -p _site/react-sdk
          cp -r frontend/packages/react-sdk/storybook-static/* _site/react-sdk/

          # Marketplace manifest
          mkdir -p _site/marketplace
          cp frontend/apps/marketplace/marketplace.json _site/marketplace/

          # Per-project artifacts + marketing docs
          for app_dir in frontend/apps/marketplace/*/; do
            project=$(basename "$app_dir")
            mkdir -p "_site/marketplace/$project"
            cp "$app_dir"*.zip                     "_site/marketplace/$project/" 2>/dev/null || true
            cp "$app_dir"dist/turing-manifest.json "_site/marketplace/$project/" 2>/dev/null || true

            # Marketing README + landing page live outside the workspace, in turing-marketplace/
            legacy="turing-marketplace/$project"
            [ -f "$legacy/index.html" ] && cp "$legacy/index.html" "_site/marketplace/$project/"
            if [ -f "$legacy/README.md" ]; then
              cp "$legacy/README.md" "_site/marketplace/$project/"
            else
              cp "$app_dir/README.md" "_site/marketplace/$project/" 2>/dev/null || true
            fi
          done

      - name: Copy static pages assets
        run: cp .github/pages/* _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
