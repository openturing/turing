name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # ── Storybook ──
      - name: Build Storybook
        working-directory: turing-react-sdk
        run: npm install --no-audit --no-fund && npx storybook build --output-dir storybook-static
        env:
          STORYBOOK_BASE: /react-sdk/

      # ── Marketplace ──
      - name: Build Marketplace examples
        run: |
          for dir in turing-marketplace/*/app; do
            project=$(basename "$(dirname "$dir")")
            echo "::group::Building $project"
            (cd "$dir" && npm run package)
            echo "::endgroup::"
          done

      # ── Assemble site ──
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/react-sdk
          cp -r turing-react-sdk/storybook-static/* _site/react-sdk/

          mkdir -p _site/marketplace
          cp turing-marketplace/marketplace.json _site/marketplace/

          for dir in turing-marketplace/*/; do
            project=$(basename "$dir")
            mkdir -p "_site/marketplace/$project"
            cp "$dir"app/*.zip "_site/marketplace/$project/"
            cp "$dir"app/dist/turing-manifest.json "_site/marketplace/$project/" 2>/dev/null || true
            cp "$dir"app/README.md "_site/marketplace/$project/" 2>/dev/null || true
          done

      - name: Generate robots.txt
        run: |
          cat > _site/robots.txt << 'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://turing.viglet.org/sitemap.xml
          EOF

      - name: Generate llms.txt
        run: |
          cat > _site/llms.txt << 'LLMS'
          # Viglet Turing ES

          > Enterprise Search Intelligence Platform combining semantic navigation, generative AI, and advanced search technologies.

          ## Documentation

          - [Turing Docs](https://docs.viglet.org/turing/): Official documentation
          - [GitHub Repository](https://github.com/openviglet/turing): Source code (Apache 2.0)

          ## React SDK

          - [React SDK Storybook](https://turing.viglet.org/react-sdk/): Interactive component documentation with hooks and UI components for enterprise search

          ## Marketplace

          - [Marketplace Index](https://turing.viglet.org/marketplace/marketplace.json): JSON catalog of available example sites and templates

          ### Available Packages

          - [Mythical Creatures](https://turing.viglet.org/marketplace/mythical-creatures/): A fantasy bestiary search site featuring dragons, griffins, phoenixes and more
          - [Space Missions](https://turing.viglet.org/marketplace/space-missions/): Explore historic and fictional space missions with semantic search
          - [Vinyl Records](https://turing.viglet.org/marketplace/vinyl-records/): A music catalog search site for vinyl records

          ## APIs

          - REST API: `POST /api/sn/{siteName}/search` - Semantic search endpoint
          - Chat API: `POST /api/v2/llm/{id}/semantic-chat` - LLM-powered conversational search (SSE streaming)
          - GraphQL: `/api/graphql` - Complex query interface

          ## SDKs

          - **React SDK**: `@viglet/turing-react-sdk` ([npm](https://www.npmjs.com/package/@viglet/turing-react-sdk))

          ## Key Features

          - Semantic Navigation with faceted search
          - Generative AI integration (OpenAI, Anthropic Claude, Google Gemini, Ollama)
          - RAG (Retrieval-Augmented Generation) pipeline
          - MCP Server for AI model integration
          - Connectors: Adobe AEM, WordPress, databases, file systems
          - Pluggable storage: MinIO, filesystem, or disabled
          LLMS

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
