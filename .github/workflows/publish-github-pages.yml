name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ── Storybook ──
      - name: Build Storybook
        working-directory: turing-react-sdk
        run: npm install --no-audit --no-fund && npx storybook build --output-dir storybook-static
        env:
          STORYBOOK_BASE: /react-sdk/

      # ── Marketplace ──
      - name: Build Marketplace examples
        run: |
          for dir in turing-marketplace/*/app; do
            project=$(basename "$(dirname "$dir")")
            echo "::group::Building $project"
            (cd "$dir" && npm run package)
            echo "::endgroup::"
          done

      # ── Assemble site ──
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/react-sdk
          cp -r turing-react-sdk/storybook-static/* _site/react-sdk/

          mkdir -p _site/marketplace
          cp turing-marketplace/marketplace.json _site/marketplace/

          for dir in turing-marketplace/*/; do
            project=$(basename "$dir")
            mkdir -p "_site/marketplace/$project"
            cp "$dir"app/*.zip "_site/marketplace/$project/"
            cp "$dir"app/dist/turing-manifest.json "_site/marketplace/$project/" 2>/dev/null || true
            # Prefer the project-root README / landing page (creative description).
            # Fall back to the technical app/README.md if project-root versions are absent.
            if [ -f "$dir"index.html ]; then
              cp "$dir"index.html "_site/marketplace/$project/"
            fi
            if [ -f "$dir"README.md ]; then
              cp "$dir"README.md "_site/marketplace/$project/"
            else
              cp "$dir"app/README.md "_site/marketplace/$project/" 2>/dev/null || true
            fi
          done

      - name: Copy static pages assets
        run: cp .github/pages/* _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
