name: Publish @viglet/turing-react-ui

# Publishes the headless UI library to npm for external embedders (T303).
# Versioning is driven by changesets: run `pnpm changeset` + `pnpm version-packages`
# locally (or in a release PR) and commit the bumped package.json before
# dispatching this workflow. The build + bundle-size budget run as a publish
# gate; npm itself rejects a version that is already published, so re-dispatching
# without a version bump is a safe no-op.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.3.1
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build @viglet/turing-react-ui
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-react-ui..." run build

      - name: Bundle-size budget (publish gate)
        working-directory: frontend/packages/react-ui
        run: pnpm run size

      - name: Test (publish gate)
        working-directory: frontend/packages/react-ui
        run: pnpm run test

      - name: Publish to npm
        working-directory: frontend/packages/react-ui
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
