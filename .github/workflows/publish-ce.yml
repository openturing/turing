# Publishes the Viglet Turing ES Community Edition SOURCE TREE to the public
# openviglet/turing-ce repo. This is the source-tree counterpart to
# publish-docker.yml (which publishes the IMAGE). It runs scripts/publish-ce.sh,
# which applies the ce-exclude.txt boundary (T356), the fail-closed secret scan
# (T358), and lands ONE squashed "Release vX.Y.Z" commit on turing-ce (T357/T359).
#
# Block P / T360, §XIX.6. This workflow is itself internal — the denylist
# (ce-exclude.txt) excludes it, so it never ships into the public snapshot.
#
# ── One-time setup ────────────────────────────────────────────────────────────
#   1. Push auth: this reuses the existing `GH_PKG_TOKEN` secret — a cross-repo
#      write credential is REQUIRED because the built-in GITHUB_TOKEN is scoped
#      to THIS (private `turing`) repo and cannot push to turing-ce, even within
#      the same `openviglet` org. GH_PKG_TOKEN already pushes git content to
#      openviglet/turing-ce (the github-pages branch in publish-github-pages.yml
#      and releases in publish.yml), so it has the `contents: write` scope this
#      job needs. No new secret to create.
#   2. Validate with a manual dry run: Actions → "Publish CE Source" → Run
#      workflow, leaving "push" = false. Inspect the log (denied paths removed,
#      secret scan clean).
#   3. Flip "push" = true to publish. The snapshot lands on a turing-ce branch
#      whose name MIRRORS the branch you ran from (run on `2026.3` -> pushes to
#      a `2026.3` branch on turing-ce, created if absent).
#
# NOTE: release tags/Releases are created on turing-ce by publish.yml
# (gh release create --repo openviglet/turing-ce), NOT on this private repo — so
# there is no on-tag trigger here; this workflow is the manual/dry-run entry
# point and the building block publish.yml calls at release time.

name: Publish CE Source

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to publish (blank = the branch/tag this run was dispatched from)"
        required: false
        default: ""
      push:
        description: "Actually push to turing-ce (false = dry run)"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-ce
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads THIS repo; the push uses GH_PKG_TOKEN
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install gitleaks (secret-scan backstop, T358)
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Resolve ref, target branch and push mode
        id: cfg
        env:
          # Bind user-controlled expressions to env vars (never interpolate them
          # straight into the script body — avoids run-block injection).
          IN_REF: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref_name }}
          IN_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          # Content to publish: explicit input, else the ref this run was
          # dispatched from (NOT some arbitrary latest tag).
          REF="$IN_REF"
          if [ -z "$REF" ]; then REF="$DISPATCH_REF"; fi
          # Target branch on turing-ce MIRRORS the branch this run executes on.
          BRANCH="$DISPATCH_REF"
          if [ "$IN_PUSH" = "true" ]; then PUSH="--push"; else PUSH=""; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "Publishing ref=$REF -> turing-ce branch '$BRANCH' mode=${PUSH:-dry-run}"

      - name: Configure push credentials (token injected by git, never logged)
        if: steps.cfg.outputs.push == '--push'
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GH_PKG_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Publish to turing-ce
        env:
          CE_REMOTE: https://github.com/openviglet/turing-ce.git
          GIT_AUTHOR_NAME: Viglet Release
          GIT_AUTHOR_EMAIL: opensource@viglet.org
          PUB_REF: ${{ steps.cfg.outputs.ref }}
          PUB_BRANCH: ${{ steps.cfg.outputs.branch }}
          PUB_PUSH: ${{ steps.cfg.outputs.push }}
          # Extracted CHANGELOG section — becomes the squash-commit body and is
          # uploaded below so publish.yml can reuse it as the Release body (T364).
          CE_NOTES_OUT: ${{ runner.temp }}/ce-release-notes.md
        run: bash scripts/publish-ce.sh --ref "$PUB_REF" --branch "$PUB_BRANCH" $PUB_PUSH

      # Makes the notes reviewable before/after a dry run, and reusable by the
      # release job — the whole point being that a squashed public history still
      # tells contributors exactly what shipped.
      - name: Upload release notes artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-release-notes
          path: ${{ runner.temp }}/ce-release-notes.md
          if-no-files-found: warn
