name: Publish Storybook

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}react-sdk/

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: turing-js-sdk/turing-react-sdk
        run: npm install --no-audit --no-fund

      - name: Build Storybook
        working-directory: turing-js-sdk/turing-react-sdk
        run: npx storybook build --output-dir storybook-static
        env:
          STORYBOOK_BASE: /react-sdk/

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/react-sdk
          cp -r turing-js-sdk/turing-react-sdk/storybook-static/* _site/react-sdk/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
