name: Publish @viglet/turing-flow-dsl

# Publishes the Viglet Turing ES chat-flow DSL to npm.
# Bump the version in frontend/packages/flow-dsl/package.json and commit it
# before dispatching this workflow. The build + tests run as a publish gate; npm
# itself rejects a version that is already published, so re-dispatching without a
# version bump is a safe no-op.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build @viglet/turing-flow-dsl
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-flow-dsl..." run build

      - name: Test (publish gate)
        working-directory: frontend/packages/flow-dsl
        run: pnpm run test

      # T926 — these two had no `sizeBudget` at all, so they were the only
      # published packages whose workflow never weighed them.
      - name: Bundle-size budget (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-flow-dsl" run size

      # T923 — the last gate before the tarball leaves: no test, story or map
      # file in it, and every declared entry point present. This check exists
      # because of three publish defects (T915, T919, T920) and until now ran
      # only in validate-js.yml, which is to say nowhere near a publish.
      - name: Publish contents (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-flow-dsl" run contents

      - name: Publish to npm
        working-directory: frontend/packages/flow-dsl
        # T914 — `pnpm publish`, never `npm publish`: npm does not rewrite pnpm's
        # `workspace:` protocol, so a package that grows a workspace dependency would
        # ship an unresolvable range. `--no-git-checks` because actions/checkout
        # leaves a detached HEAD, which pnpm's branch check rejects.
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
