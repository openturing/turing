name: Publish frontend/packages/react-sdk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Install workspace deps ──
      # Regenerate package-lock on the runner to resolve platform-specific
      # native optional deps (e.g. @tailwindcss/oxide-linux-x64-gnu) — avoids
      # npm/cli#4828 with workspaces + committed Windows lockfile.
      - name: Install workspace deps
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # ── Bump every workspace (root + apps + packages) by a patch ──
      - name: Bump all workspaces (patch)
        working-directory: frontend
        run: npm version patch --workspaces --include-workspace-root --no-git-tag-version

      # ── Build & publish the SDK (which now carries the bumped version) ──
      - name: Build @viglet/turing-react-sdk
        working-directory: frontend/packages/react-sdk
        run: npm run build

      - name: Publish @viglet/turing-react-sdk
        working-directory: frontend/packages/react-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Commit every package.json touched by the workspace-wide bump ──
      - name: Commit version bump
        run: |
          git add frontend/package.json \
                  frontend/packages/*/package.json \
                  frontend/apps/turing-app/package.json \
                  frontend/apps/marketplace/*/package.json
          git commit -m "chore: bump frontend workspaces to match @viglet/turing-react-sdk [skip ci]" || echo "No changes to commit"
          git push
