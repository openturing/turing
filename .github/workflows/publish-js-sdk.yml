name: Publish turing-react-sdk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Build, Bump & Publish turing-react-sdk ──
      - name: Build turing-react-sdk
        working-directory: turing-react-sdk
        run: npm run build

      - name: Bump & Publish turing-react-sdk
        working-directory: turing-react-sdk
        run: |
          npm version patch --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Commit version bump back to branch ──
      - name: Commit version bump
        run: |
          git add turing-react-sdk/package.json
          git commit -m "chore: bump turing-react-sdk version [skip ci]" || echo "No changes to commit"
          git push
