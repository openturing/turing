name: Publish JavaScript SDKs

on:
  push:
    branches:
      - publish/javascript

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@viglet"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Create .npmrc in each package dir to force GitHub Packages ──
      - name: Configure npm registry
        run: |
          for dir in turing-js-sdk/js-sdk-lib turing-js-sdk/turing-react-sdk; do
            echo "@viglet:registry=https://npm.pkg.github.com" > "$dir/.npmrc"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> "$dir/.npmrc"
          done

      # ── Build, Bump & Publish turing-sdk (JS SDK) ──
      - name: Build turing-sdk
        working-directory: turing-js-sdk/js-sdk-lib
        run: npm run build

      - name: Bump & Publish turing-sdk
        working-directory: turing-js-sdk/js-sdk-lib
        run: |
          npm version patch --no-git-tag-version
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build, Bump & Publish turing-react-sdk ──
      - name: Build turing-react-sdk
        working-directory: turing-js-sdk/turing-react-sdk
        run: npm run build

      - name: Bump & Publish turing-react-sdk
        working-directory: turing-js-sdk/turing-react-sdk
        run: |
          npm version patch --no-git-tag-version
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Commit version bumps back to branch ──
      - name: Commit version bumps
        run: |
          git add turing-js-sdk/js-sdk-lib/package.json turing-js-sdk/turing-react-sdk/package.json
          git commit -m "chore: bump JS SDK versions [skip ci]" || echo "No changes to commit"
          git push
