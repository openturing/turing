name: Publish frontend/packages/react-sdk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Install workspace deps ──
      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # ── Bump the published package only ──
      # T876: this used to patch-bump every workspace, so packages that were not
      # published still got a new version number and their package.json drifted
      # from what npm actually holds. Only react-sdk is released here, so only
      # react-sdk is bumped; the vanilla SDK has publish-sdk.yml.
      - name: Bump @viglet/turing-react-sdk (patch)
        working-directory: frontend/packages/react-sdk
        run: npm version patch --no-git-tag-version

      # ── Build & publish the SDK (which now carries the bumped version) ──
      # T875: this step used to run `build:sdk`, which filters the *vanilla*
      # `@viglet/turing-sdk`. react-sdk depends on sdk and not the reverse, so
      # turbo never built react-sdk here — it was built only as a side effect of
      # its own `prepublishOnly`. The `...` suffix builds react-sdk plus its
      # workspace dependencies, matching validate-js.yml and publish-react-ui.yml.
      - name: Build @viglet/turing-react-sdk
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-react-sdk..." run build

      # T875: publish-react-ui.yml gates on size and test; this workflow gated on
      # neither. `--if-present` keeps the test gate green until react-sdk grows a
      # suite (T877), after which it becomes a real gate with no workflow change.
      - name: Bundle-size budget (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-react-sdk" run size

      - name: Test (publish gate)
        working-directory: frontend
        run: pnpm --filter "@viglet/turing-react-sdk" run --if-present test

      # T914 — this is the package the bug was found on. react-sdk depends on
      # `@viglet/turing-sdk` and `@viglet/turing-react-ui` at `workspace:*`, and
      # `npm publish` copies that protocol into the manifest verbatim: these are
      # pnpm workspaces, not npm ones, so npm has nothing to resolve it against.
      # `pnpm publish` rewrites it to the workspace package's real version — the
      # versions already on npm, now that T876 stopped the phantom bumps.
      # `--no-git-checks` because actions/checkout leaves a detached HEAD and the
      # version bump above leaves the tree dirty; pnpm rejects both by default.
      - name: Publish @viglet/turing-react-sdk
        working-directory: frontend/packages/react-sdk
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Commit the one package.json the bump touched ──
      - name: Commit version bump
        run: |
          git add frontend/packages/react-sdk/package.json
          git commit -m "chore: bump @viglet/turing-react-sdk [skip ci]" || echo "No changes to commit"
          git push
