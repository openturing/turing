name: Publish frontend/packages/react-sdk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Install workspace deps ──
      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # ── Bump every workspace (root + apps + packages) by a patch ──
      - name: Bump all workspaces (patch)
        working-directory: frontend
        run: pnpm -r --include-workspace-root exec -- npm version patch --no-git-tag-version

      # ── Build & publish the SDK (which now carries the bumped version) ──
      - name: Build @viglet/turing-react-sdk
        working-directory: frontend
        run: pnpm run build:sdk

      - name: Publish @viglet/turing-react-sdk
        working-directory: frontend/packages/react-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Commit every package.json touched by the workspace-wide bump ──
      - name: Commit version bump
        run: |
          git add frontend/package.json                   frontend/packages/*/package.json                   frontend/apps/turing-app/package.json                   frontend/apps/marketplace/*/package.json
          git commit -m "chore: bump frontend workspaces to match @viglet/turing-react-sdk [skip ci]" || echo "No changes to commit"
          git push
