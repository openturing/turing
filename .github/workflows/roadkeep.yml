# The gate the write path already runs locally, called in CI through the action
# roadkeep publishes rather than a copied `run:` block, which drifts per
# repository. `roadkeep lint` exits 1 on a governed file that drifted, and that
# exit code is the whole contract.
#
# **The gate is absolute** (T967). It ran against a baseline for as long as the
# adoption cleanup was in progress — 24 sections citing a `§` that no prose file
# declared any more, plus one ledger entry naming a script later extracted to
# another repository. The 24 were repointed; the ledger entry stopped being a
# finding when roadkeep itself learned that a path absent from HEAD but present in
# history is history and not drift (RK1217, upstream). `roadkeep lint` now exits 0
# on the default branch with nothing forgiven, so nothing is forgiven: a finding
# here is something this branch introduced.
#
# Do not reintroduce `baseline:` to make a red run green. It forgives by name,
# which means the next real finding hides behind the same list.
#
# **The action is pinned** (T969). `@main` was fine while the gate forgave a
# baseline: both moved, and only new findings mattered. Absolute, an unpinned gate
# means a rule added upstream turns this build red on prose nobody here touched,
# and roadkeep's main moves several times a day — 0.1.678 to 0.1.1026 inside one
# afternoon. The pin below is roadkeep 0.1.1026, verified to lint this corpus
# clean before it was written down.
#
# To bump: pick the new SHA, run `roadkeep lint` from that revision against this
# repo, and only then change the line — the pin is what makes a red build
# reproducible, so it moves deliberately or not at all. Bumping is also how a fix
# landed upstream (RK1217 was one) reaches this gate; it does not arrive on its
# own any more, which is the price of the pin and the point of it.
#
# The plugin a session runs is NOT pinned here — it is the Claude Code plugin
# cache. `roadkeep engines` names both; when they disagree, the version in this
# file is the one that decides the build, and `/plugin update` is what moves the
# local copy to match.
#
# **On demand only** (T929). 24a848332e moved this to manual dispatch and left the
# prose describing a per-branch gate, which is how T922 came to read the state as
# an oversight and had to be reverted (T928).
name: roadkeep

on:
  workflow_dispatch:

jobs:
  lint:
    name: roadkeep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # roadkeep 0.1.1026 — see the note above before changing this SHA.
      - uses: alegauss/roadkeep@3000de2101e96e698b5d29ae31e59c0d6f231e2b
