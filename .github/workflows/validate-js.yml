name: Validate JavaScript Projects

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@viglet/turing-react-sdk"
          - "@viglet/turing-react-ui"
          - "@viglet/turing-sdk"
          - turing-example-mythical-creatures
          - turing-example-space-missions
          - turing-example-vinyl-records

    name: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}..." run build

      # Bundle-size budget for the publishable packages (T303). The
      # marketplace example apps are not @viglet/-scoped and have no size script.
      - name: Bundle-size budget
        if: startsWith(matrix.workspace, '@viglet/')
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run size
