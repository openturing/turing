name: Validate JavaScript Projects

on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # T873: `@viglet/turing-cli` and `@viglet/turing-flow-dsl` are published
      # packages with real `node --test` suites that appeared in no matrix, so a
      # break surfaced only at release time, to whoever was trying to ship.
      # `size` is declared per entry rather than inferred from the `@viglet/`
      # prefix — only the three bundle packages carry a `sizeBudget` block.
      matrix:
        include:
          - workspace: "@viglet/turing-react-sdk"
            size: true
          - workspace: "@viglet/turing-react-ui"
            size: true
          - workspace: "@viglet/turing-sdk"
            size: true
          - workspace: "@viglet/turing-cli"
            size: false
          - workspace: "@viglet/turing-flow-dsl"
            size: false
          # T874: the admin app carries the largest frontend suite in the repo
          # and ran in no workflow at all — validate.yml is the Maven build and
          # publish.yml only uploads the jar.
          - workspace: turing-app
            size: false
          - workspace: turing-example-mythical-creatures
            size: false
          - workspace: turing-example-space-missions
            size: false
          - workspace: turing-example-vinyl-records
            size: false

    name: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}..." run build

      # Bundle-size budget for the packages that declare one (T303).
      - name: Bundle-size budget
        if: matrix.size
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run size

      # T861: this job used to build and weigh the packages but never ran their
      # tests, so `@viglet/turing-sdk` could declare a `test` script it had no
      # runner for and nothing noticed. `--if-present` keeps the matrix entries
      # that genuinely have no suite (the marketplace examples) passing.
      - name: Test
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run --if-present test
