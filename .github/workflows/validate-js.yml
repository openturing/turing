name: Validate JavaScript Projects

on:
  push:
    branches: ["2026.2"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: turing-react-sdk
            directory: turing-react-sdk
            script: build
          - name: mythical-creatures
            directory: turing-marketplace/mythical-creatures/app
            script: compile
          - name: space-missions
            directory: turing-marketplace/space-missions/app
            script: compile
          - name: vinyl-records
            directory: turing-marketplace/vinyl-records/app
            script: compile

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.script }}
