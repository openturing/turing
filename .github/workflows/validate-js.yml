name: Validate JavaScript Projects

on:
  workflow_dispatch:
  # T863: the bundle-size guard used to run only in `prepublishOnly`, so a
  # regression was reported to whoever next tried to publish — the wrong person
  # at the wrong moment. Running the whole job on PRs puts build + size + test
  # in front of the author of the change instead.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/validate-js.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@viglet/turing-react-sdk"
          - "@viglet/turing-react-ui"
          - "@viglet/turing-sdk"
          - turing-example-mythical-creatures
          - turing-example-space-missions
          - turing-example-vinyl-records

    name: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}..." run build

      # Bundle-size budget for the publishable packages (T303). The
      # marketplace example apps are not @viglet/-scoped and have no size script.
      - name: Bundle-size budget
        if: startsWith(matrix.workspace, '@viglet/')
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run size

      # T861: this job used to build and weigh the packages but never ran their
      # tests, so `@viglet/turing-sdk` could declare a `test` script it had no
      # runner for and nothing noticed. `--if-present` keeps the matrix entries
      # that genuinely have no suite (the marketplace examples) passing.
      - name: Test
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run --if-present test
