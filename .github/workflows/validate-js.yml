name: Validate JavaScript Projects

on:
  push:
    branches: ["2026.2"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@viglet/turing-react-sdk"
          - turing-example-mythical-creatures
          - turing-example-space-missions
          - turing-example-vinyl-records

    name: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install workspace deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: frontend
        run: npm run build --workspace ${{ matrix.workspace }}
