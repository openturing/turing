name: Validate JavaScript Projects

on:
  push:
    branches: ["2026.2"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend/packages/react-sdk
            directory: frontend/packages/react-sdk
            script: build
          - name: mythical-creatures
            directory: frontend/apps/marketplace/mythical-creatures
            script: compile
          - name: space-missions
            directory: frontend/apps/marketplace/space-missions
            script: compile
          - name: vinyl-records
            directory: frontend/apps/marketplace/vinyl-records
            script: compile

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.script }}
