name: Validate JavaScript Projects

# T922 — this ran on dispatch only, so every gate in it was armed and never fired.
# Both triggers are needed: work reaches 2026.x through pull requests (Dependabot,
# `claude/*` branches) and through direct pushes to the version branch.
#
# The branch filter is a pattern, not a name — T921's lesson one file over: a list
# that must be extended per version is a list that misses one.
#
# The Java paths are not incidental. T892's enum-mirror test reads the Java enum
# declarations out of `turing-app` and `turing-commons` and asserts set equality
# with their TypeScript unions, so a backend-only change can break this suite. It
# is a broad filter on purpose: a mirror gate that skips when only one side moved
# is the defect it exists to catch.
# The two path lists are duplicated rather than shared through a YAML anchor:
# GitHub Actions does not resolve anchors, so an alias here parses locally and
# breaks in CI.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "turing-app/src/main/java/**"
      - "turing-commons/src/main/java/**"
      - ".github/workflows/validate-js.yml"
  push:
    branches: ["2026.*"]
    paths:
      - "frontend/**"
      - "turing-app/src/main/java/**"
      - "turing-commons/src/main/java/**"
      - ".github/workflows/validate-js.yml"

# 40+ commits a day land on the version branch; without this each one would leave
# eleven jobs running against a ref nobody is looking at any more.
concurrency:
  group: validate-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # T873: `@viglet/turing-cli` and `@viglet/turing-flow-dsl` are published
      # packages with real `node --test` suites that appeared in no matrix, so a
      # break surfaced only at release time, to whoever was trying to ship.
      # `size` is declared per entry rather than inferred from the `@viglet/`
      # prefix — only the three bundle packages carry a `sizeBudget` block.
      matrix:
        include:
          - workspace: "@viglet/turing-react-sdk"
            size: true
          - workspace: "@viglet/turing-react-ui"
            size: true
          - workspace: "@viglet/turing-sdk"
            size: true
          - workspace: "@viglet/turing-cli"
            size: false
          - workspace: "@viglet/turing-flow-dsl"
            size: false
          # T874: the admin app carries the largest frontend suite in the repo
          # and ran in no workflow at all — validate.yml is the Maven build and
          # publish.yml only uploads the jar.
          - workspace: turing-app
            size: false
          # T916: the last two apps. The showcase — the Block Y reference app and
          # the widest platform surface here — built in no workflow at all, and
          # the marketing site built only inside publish-github-pages.yml, which
          # is to say its build was verified by the act of publishing it. Neither
          # has tests, so `--if-present` skips the Test step and this is a build
          # gate. turing-site's `build` runs its SSR pass, prerender and OG image
          # too; that is the chain that ships, so it is the chain to check.
          - workspace: turing-showcase
            size: false
          - workspace: turing-site
            size: false
          - workspace: turing-example-mythical-creatures
            size: false
          - workspace: turing-example-space-missions
            size: false
          - workspace: turing-example-vinyl-records
            size: false

    name: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}..." run build

      # T918: the shipping tsconfig excludes tests, stories and vitest config so
      # they never reach `dist` — which also meant nothing type-checked them,
      # since vitest transpiles without checking. `tsconfig.test.json` includes
      # them and emits nothing. `--if-present` covers the apps, whose own
      # tsconfig already has their tests in the build.
      - name: Type-check tests
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run --if-present typecheck

      # Bundle-size budget for the packages that declare one (T303).
      - name: Bundle-size budget
        if: matrix.size
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run size

      # T919: what the tarball would actually contain — no tests or stories
      # (T915, T919), and every declared entry point present. The size budget
      # weighs bytes; this checks membership, which is the half that let 168
      # Storybook entries and 56 compiled tests reach npm unnoticed.
      - name: Publish contents
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run --if-present contents

      # T861: this job used to build and weigh the packages but never ran their
      # tests, so `@viglet/turing-sdk` could declare a `test` script it had no
      # runner for and nothing noticed. `--if-present` keeps the matrix entries
      # that genuinely have no suite (the marketplace examples) passing.
      - name: Test
        working-directory: frontend
        run: pnpm --filter "${{ matrix.workspace }}" run --if-present test
