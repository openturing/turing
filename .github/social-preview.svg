<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    GitHub social preview card for openviglet/turing-ce (1280x640, the size
    GitHub recommends). Brand-consistent with frontend/apps/site/public/og.svg.
    Render to PNG with: node .github/render-social-preview.mjs
    Upload at: repo Settings -> Social preview.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="1" stop-color="#0a0d1c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4169E1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4169E1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4169E1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="130" cy="70" r="380" fill="url(#orbA)"/>
  <circle cx="1190" cy="130" r="340" fill="url(#orbB)"/>

  <!-- logo mark + wordmark. The mark is the real Turing ES brand asset
       (Design/Turing_ES_1024.png), downscaled to 256px and inlined so this SVG
       stays self-contained. -->
  <g transform="translate(80, 70)">
    <image x="0" y="0" width="76" height="76" href="data:image/png;base64,"/>
    <text x="94" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#f2f4fb">Viglet Turing ES</text>
    <text x="94" y="64" font-family="Consolas, monospace" font-size="17" font-weight="500" fill="#7c86a8">openviglet/turing-ce</text>
  </g>

  <!-- status pill -->
  <g transform="translate(80, 190)">
    <rect width="452" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="26" cy="21" r="5" fill="#34d399"/>
    <text x="44" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#c7d0ee">Apache 2.0 · Self-hosted · Java 21 + Spring Boot 4</text>
  </g>

  <!-- headline -->
  <text x="80" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#f2f4fb">Enterprise search,</text>
  <text x="80" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#brand)">cited RAG and AI agents</text>
  <text x="80" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#f2f4fb">— over your own content.</text>

  <!-- subline -->
  <text x="80" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500" fill="#aeb7d4">Apache Solr · Elasticsearch · embedded Lucene — and any LLM.</text>

  <!-- engine chips -->
  <g transform="translate(80, 550)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9aa4c6">
    <rect width="176" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="88" y="23" text-anchor="middle">Hybrid BM25 + kNN</text>
    <rect x="188" width="142" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="259" y="23" text-anchor="middle">Faceted search</text>
    <rect x="342" width="112" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="398" y="23" text-anchor="middle">MCP tools</text>
    <rect x="466" width="212" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="572" y="23" text-anchor="middle">Adobe AEM · WordPress</text>
  </g>

  <!-- url -->
  <text x="1200" y="594" text-anchor="end" font-family="Consolas, monospace" font-size="20" font-weight="500" fill="#6b7394">turing.viglet.org</text>
</svg>
