# To get started with Dependabot version updates, you'll need to specify which
# Package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      java:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/turing-react" # Location of package manifests
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/turing-js-sdk/js-sdk-lib" # Location of package manifests
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
    groups:
      sdk-lib:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/turing-js-sdk/js-sdk-sample" # Location of package manifests
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
    groups:
      sdk-sample:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/turing-js-sdk/turing-react-sdk"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
    groups:
      react-sdk:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/turing-marketplace/mythical-creatures/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      marketplace-mythical-creatures:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/turing-marketplace/space-missions/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      marketplace-space-missions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/turing-marketplace/vinyl-records/app"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    groups:
      marketplace-vinyl-records:
        applies-to: version-updates
        patterns:
          - "*"
