# T641 / §XXXVII.3 — reverse-proxy abuse controls for the anonymous public
# surface. The app also enforces per-IP/session limits in-process
# (TurAnonymousAbuseRateLimitFilter) so protection does not depend solely on
# this proxy, but limiting at the edge sheds load before it reaches the app.
#
# Rate-limit zones keyed by client IP. `chat` is tight (LLM-cost bearing);
# `search` is looser (autocomplete is chatty). Tune `rate`/`burst` per deploy.
limit_req_zone $binary_remote_addr zone=turing_chat:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=turing_search:10m rate=120r/m;
# Cap concurrent connections per IP to blunt slow-loris / fan-out abuse.
limit_conn_zone $binary_remote_addr zone=turing_conn:10m;

# Return 429 (not the nginx default 503) so clients back off correctly.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    charset utf-8;
    access_log on;

    # Anonymous RAG chat — the unbounded-LLM-spend surface. Tightest limit;
    # a small burst absorbs legitimate rapid follow-ups without queuing.
    location ~ ^/api/sn/[^/]+/chat(/|$) {
        limit_req zone=turing_chat burst=5 nodelay;
        limit_conn turing_conn 10;
        proxy_pass http://turing:2700;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE streaming — don't buffer or prematurely time out the response.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Anonymous search / autocomplete / query / spell-check — looser limit.
    location ~ ^/api/sn/[^/]+/(?:ac|search|_search|query|persona)(/|$) {
        limit_req zone=turing_search burst=40 nodelay;
        limit_conn turing_conn 20;
        proxy_pass http://turing:2700;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://turing:2700;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static {
        access_log   off;
        expires      30d;

        alias /app/static;
    }
}
