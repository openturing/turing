# Turing's roadkeep configuration — the third real corpus, after Shio (RK20) and
# roadkeep's own (RK21).
#
# NOT WIRED INTO CI, AND NOT READY TO BE. Under this file `roadkeep lint` reports 407
# findings, and the point of writing it now is that the measurement is reproducible —
# `roadkeep -C . lint --json`. What each class needs, largest first:
#
#   216  block.missing   22 sub-block headings spell `## D.1 — …` where the same file
#                        writes `## Block A/B/C`. That is Turing's own inconsistency and
#                        the fix is renaming them: `D.1` is already a legal block label.
#    88  the roadmap     32 `why` over 200, 31 lines over 320, 25 with a second sentence,
#                        across 46 lines. This is the ask adoption is *for*: each of them
#                        points at a section in IMPROVEMENTS.md that already makes the
#                        argument at length, so the limit wants the sentence that
#                        paragraph is the long form of — never a deletion.
#    68  IMPROVEMENTS    25 sections over 250 words, 40 rationales whose task already
#                        shipped (`ship` deletes the section; these survived a hand edit),
#                        3 sections nothing points at.
#    12  deps.stale      derived, so `roadkeep --fix` repairs all 12 and nothing else.
#    11  ref.unresolved  §LVIII.1-3 and eight more point at headings that do not exist.
#     8  path.missing    files a shipped line names that are no longer in the repository.
#     4  id.format       `T24b`, `T221a`, `T227a` and one more: a sub-lettered id, which
#                        the format has no shape for. Turing renumbers, or roadkeep grows
#                        one — an open question, not a defect either way.
#
# None of these are roadkeep defects: 755 ledger entries and all 46 roadmap lines parse.
# Every value below is what the files already spell, so adopting the tool changes the
# format of nothing that is already correct.

prefix = "T"

# Turing numbers its rationale by a hand-kept outline (§LVIII.2), not by task id.
# Migrating a live outline is a separate decision from adopting the tool, so the scheme
# follows the file rather than the file following the scheme.
ref_scheme = "outline"

# agents.md cites task ids in prose, and an id the scan misses is an id that gets reused.
id_sources = ["agents.md"]

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"
strategy = "docs/STRATEGY.md"

[limits]
# symptom is left at the default because the corpus already meets it: 0 of 46 lines exceed
# 120 characters. The field the authors kept short is the one whose scope is bounded by
# what it is — "what does not work" is one clause.
symptom = 120

# why and line are left at the defaults *although* 32 and 31 of the 46 exceed them, which
# is the whole point of adopting: each of those lines points at a section in
# IMPROVEMENTS.md that already makes the same argument at length, so the limit asks for the
# sentence that the paragraph at the pointer is the long form of — not for a deletion.
why = 200
line = 320

section = 250
prose = 88

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

[ledger]
# The two slots Turing's ledger lines do not have: no marker, because the file itself is
# the statement that the work shipped (RK43), and no bold symptom, because every entry is
# `- **T1** — <prose>` (RK48). Declared here, so those entries parse and the deps that
# point at them resolve instead of reading as "in neither file".
marker = false
symptom = false

[limits.changelog]
# The ledger's own numbers (RK50). Its 755 entries predate the tool and reach 8095
# characters at the worst: holding history to the 320 a roadmap line is refused at produces
# 582 findings about work nobody will redo. The gate that matters is still the write path —
# `ship` copies a why already refused at 200, so every entry this tool writes is short by
# construction, and only a hand-written `record` could use the room.
why = 8100
line = 8200

[rules.changelog]
# The two prose rules this file's history cannot obey (RK52). `why is one sentence` says the
# remainder belongs in the section the line points at, and a shipped line has none: 698 of
# these entries are paragraphs written before the tool existed, and no edit short of
# deleting them satisfies the rule. The roadmap keeps both rules, which is where they bite.
one_sentence = false
terminator = false
