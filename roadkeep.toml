# Turing's roadkeep configuration — the third real corpus, after Shio (RK20) and
# roadkeep's own (RK21).
#
# WIRED IN, AND THE WRITE PATH NOW. The tool owns the four files below: `.mcp.json` offers
# its verbs, a `PreToolUse` hook denies an `Edit` on any of them, `.claude/skills/roadkeep/`
# says which command to call, and `.github/workflows/roadkeep.yml` runs the gate. The gate
# is wired **against a baseline** rather than absolutely — a corpus this old cannot pass an
# absolute count on the day it adopts a schema, and a number that moves by one per pull
# request carries no signal, so CI fails on what a branch added and forgives the rest by
# name. Drop the baseline the day `roadkeep -C . lint` exits 0, and the gate goes absolute.
#
# The live number is `roadkeep -C . lint` and is deliberately not copied here: a count in a
# comment is a count that goes stale, which is the drift this tool exists to stop. What the
# adoption measurement found, and where each class went:
#
#   block.missing   22 sub-block headings spelled `## D.1 — …` where the same file writes
#                   `## Block A/B/C`, hiding 216 ledger lines from every count. Renamed —
#                   `D.1` was already a legal label, only the word was missing.
#   deps.stale      derived, so `roadkeep lint --fix` repaired them and nothing else.
#   id.format       `T24b`, `T221a`, `T227a`, `T228a` — a split recorded by sub-lettering.
#                   Closed by declaring the shape (`[ids] suffix`), not by renumbering four
#                   shipped entries, which would be changing history over a config key.
#   the roadmap     `why` over 200, lines over 320, a second sentence — the ask adoption is
#                   *for*: each such line points at a section in IMPROVEMENTS.md that
#                   already makes the argument at length, so the limit wants the sentence
#                   that paragraph is the long form of, never a deletion.
#   IMPROVEMENTS    sections over 250 words, rationales whose task already shipped (`ship`
#                   deletes the section; those survived a hand edit — `section drop` is the
#                   verb for the ones already orphaned), sections nothing points at.
#
# None of these were roadkeep defects: 755 ledger entries and all 46 roadmap lines parse.
# Every value below is what the files already spell, so adopting the tool changed the
# format of nothing that was already correct.

prefix = "T"

# Turing numbers its rationale by a hand-kept outline (§LVIII.2), not by task id.
# Migrating a live outline is a separate decision from adopting the tool, so the scheme
# follows the file rather than the file following the scheme.
ref_scheme = "outline"

# agents.md cites task ids in prose, and an id the scan misses is an id that gets reused.
id_sources = ["agents.md"]

[refs]
# T902. Both prose files number from the same outline, so 13 addresses named a section in
# each — §VIII, §IX, §IX.1–§IX.4, §X, §X.1, §X.5, §XII, §XII.2, §XIV, §XVI — and a pointer
# to any of them resolved to two. A namespace gives STRATEGY.md its own address space, so
# the collision is answered by where a section lives rather than by renumbering an outline
# that predates the tool. IMPROVEMENTS.md keeps the bare outline it has always used: it
# holds every `→ §` a task line points at, and renaming those would rewrite the pointers on
# work already shipped.
strategy = "S"

[ids]
# `T24b`, `T221a`, `T227a`, `T228a` — a split recorded by sub-lettering the id it came
# from, which four ledger entries already spell. Declaring the shape is what closes the
# open question the header used to carry: the alternative was renumbering four shipped
# entries, i.e. changing history because a config key was not set. The scan reads the
# number out of a sub-lettered id, so `next-id` clears it like any other.
suffix = true

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"
strategy = "docs/STRATEGY.md"

[limits]
# symptom is left at the default because the corpus already meets it: 0 of 46 lines exceed
# 120 characters. The field the authors kept short is the one whose scope is bounded by
# what it is — "what does not work" is one clause.
symptom = 120

# why and line are left at the defaults *although* 32 and 31 of the 46 exceed them, which
# is the whole point of adopting: each of those lines points at a section in
# IMPROVEMENTS.md that already makes the same argument at length, so the limit asks for the
# sentence that the paragraph at the pointer is the long form of — not for a deletion.
why = 200
line = 320

section = 250
prose = 88

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

[ledger]
# The two slots Turing's ledger lines do not have: no marker, because the file itself is
# the statement that the work shipped (RK43), and no bold symptom, because every entry is
# `- **T1** — <prose>` (RK48). Declared here, so those entries parse and the deps that
# point at them resolve instead of reading as "in neither file".
marker = false
symptom = false

[limits.changelog]
# The ledger's own numbers (RK50). Its 755 entries predate the tool and reach 8095
# characters at the worst: holding history to the 320 a roadmap line is refused at produces
# 582 findings about work nobody will redo. The gate that matters is still the write path —
# `ship` copies a why already refused at 200, so every entry this tool writes is short by
# construction, and only a hand-written `record` could use the room.
why = 8100
line = 8200

[rules.changelog]
# The two prose rules this file's history cannot obey (RK52). `why is one sentence` says the
# remainder belongs in the section the line points at, and a shipped line has none: 698 of
# these entries are paragraphs written before the tool existed, and no edit short of
# deleting them satisfies the rule. The roadmap keeps both rules, which is where they bite.
one_sentence = false
terminator = false
