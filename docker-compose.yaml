version: '3'
services:
  turing-nginx:
    container_name: turing-nginx
    image: nginx:1.25.2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./containers/nginx/conf.d:/etc/nginx/conf.d
  turing-solr:
    container_name: turing-solr
    build: ./containers/solr
    restart: always    
    ports:
      - "8983:8983"
    volumes:
      - vol-solr:/var/solr
    environment:
      - ZK_HOST=turing-zk:2181
    depends_on:
      - turing-zk
  turing-zk:
    container_name: turing-zk
    hostname: turing-zk
    restart: always
    image: zookeeper:3.9.1
    volumes:
      - vol-zk:/data
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=turing-zk:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: mntr, conf, ruok
      ZOO_CFG_EXTRA: "metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7000 metricsProvider.exportJvmInfo=true"
  turing-mariadb:
    container_name: turing-mariadb
    build: ./containers/mariadb
    restart: always    
    ports:
      - "3306:3306"
    volumes:
      - vol-mariadb:/var/lib/mysql
    environment:
      MYSQL_DATABASE: turing
      MYSQL_ROOT_PASSWORD: turing
      MYSQL_USER: turing
      MYSQL_PASSWORD: turing
  turing:
    container_name: turing
    build: .
    restart: always
    ports:
     - "2700:2700"
    volumes:
      # The app writes ALL state under ${user.dir}/store == /app/store (H2 DB,
      # Lucene index, assets, ONNX/DJL caches, code-interpreter sessions). This
      # MUST match the image's WORKDIR/VOLUME (/app/store) — an earlier mount at
      # /turing/store never persisted anything.
      - vol-turing-store:/app/store
      # ─────────────────── Code Interpreter DOCKER mode (T80) ────────────────
      # Uncomment the block below to enable the containerized ("DOCKER") Code
      # Interpreter execution mode. It uses Docker-out-of-Docker: the Turing
      # container talks to the HOST's Docker daemon over the bind-mounted socket
      # and spawns each Python sandbox as a SIBLING container on the host.
      #
      # CRITICAL: with Docker-out-of-Docker the per-execution session directory
      # is bind-mounted into the sandbox BY ABSOLUTE PATH (/app/store/code-
      # interpreter/...), and the HOST daemon resolves that path against the HOST
      # filesystem. So the store dir must exist on the host at the SAME path.
      # Replace the named volume above with a host bind mount at /app/store:
      #   - /opt/turing/store:/app/store   # (remove the vol-turing-store line)
      # and create /opt/turing/store on the host (chown to uid 1001). A named
      # volume will NOT work for DOCKER mode — its host path (/var/lib/docker/
      # volumes/...) differs from /app/store, so the sandbox sees an empty mount.
      #
      # Then mount the host Docker socket:
      #   - /var/run/docker.sock:/var/run/docker.sock
      #
      # Finally, in Console -> Global Settings -> Code Interpreter, switch the
      # execution mode to DOCKER and click "Check Docker". For hardened /
      # multi-tenant setups, consider gVisor via
      # turing.code-interpreter.docker.runtime=runsc (see docs).
    depends_on:
      - turing-nginx
      - turing-mariadb
      - turing-solr
    # DOCKER mode only: give the non-root `java` process (uid 1001) access to the
    # mounted host socket by joining the socket's group. Replace 999 with your
    # host's docker gid: `getent group docker | cut -d: -f3`.
    # group_add:
    #   - "999"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://turing-mariadb:3306/turing
      SPRING_DATASOURCE_USERNAME: turing
      SPRING_DATASOURCE_PASSWORD: turing
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MariaDBDialect
      TURING_SOLR_CLOUD: true
#     SERVER_SSL_KEY_STORE: /turing/store/cert/turing.p12
#     SERVER_SSL_KEY_STORE_PASSWORD: turing
#     SERVER_SSL_KEY_STORE_TYPE: PKCS12
#     SERVER_SSL_KEY_ALIAS: turing
#     SERVER_SSL_ENABLED: true
      # --- T739 / Content Ingestion: headless URL fetching (browserless) ---
      # The turing-browserless sidecar below renders JS-heavy pages (SPAs) so
      # their text can be ingested (Persona Match, Persona sources). Uncomment
      # to PIN the mode per container; otherwise configure it in the admin UI
      # (Global Settings -> Platform -> Content Ingestion). AUTO = cheap HTTP
      # fetch first, render only when too little text is extracted.
#     TURING_URLFETCH_MODE: AUTO
#     TURING_URLFETCH_BROWSERLESSURL: http://turing-browserless:3000
  turing-browserless:
    container_name: turing-browserless
    # Headless Chromium sidecar (T739 / §XLVIII). Exposes a REST /content that
    # returns the rendered DOM. Kept on the internal compose network — do NOT
    # publish its port publicly: a reachable headless browser is an SSRF pivot.
    image: ghcr.io/browserless/chromium:latest
    restart: always
    environment:
      # Cap concurrent sessions and per-page time so a heavy page can't exhaust
      # the container. Set TOKEN and mirror it in the admin UI / TURING_URLFETCH_BROWSERLESSTOKEN.
      MAX_CONCURRENT_SESSIONS: "5"
      TIMEOUT: "30000"
      # TOKEN: change-me
    # Not published to the host by default (internal-only). Uncomment to debug:
    # ports:
    #   - "3000:3000"
  turing-prometheus:
    container_name: turing-prometheus
    build: ./containers/prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - vol-prometheus:/prometheus
    extra_hosts:
      # Resolves to the Docker host so Prometheus can scrape a Turing process
      # running on the host (e.g. `mvn spring-boot:run`). Docker Desktop maps
      # host.docker.internal automatically; this line is required on Linux.
      # If you scrape the `turing` service in this same compose, edit
      # containers/prometheus/prometheus.yml to target `turing:2700` instead.
      - "host.docker.internal:host-gateway"
  turing-grafana:
    container_name: turing-grafana
    build: ./containers/grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - vol-grafana:/var/lib/grafana
    depends_on:
      - turing-prometheus
volumes:
  vol-solr:
  vol-zk:
  vol-turing-store:
  vol-mariadb:
  vol-prometheus:
  vol-grafana:
