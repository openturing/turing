packages:
  - "apps/turing-app"
  - "apps/site"
  - "apps/showcase"
  - "apps/marketplace/*"
  - "packages/*"

# Dependencies allowed to run install/build scripts. pnpm 11 replaced the
# package.json "pnpm.onlyBuiltDependencies" list with this name -> bool map and
# blocks unlisted build scripts by default (strictDepBuilds).
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@tailwindcss/oxide": true

minimumReleaseAgeExclude:
  - '@viglet/viglet-design-system@2026.3.2'
  - '@radix-ui/primitive@1.1.5'
  - '@radix-ui/react-accordion@1.2.16'
  - '@radix-ui/react-alert-dialog@1.1.19'
  - '@radix-ui/react-avatar@1.2.2'
  - '@radix-ui/react-checkbox@1.3.7'
  - '@radix-ui/react-collapsible@1.1.16'
  - '@radix-ui/react-collection@1.1.12'
  - '@radix-ui/react-context-menu@2.3.3'
  - '@radix-ui/react-context@1.2.0'
  - '@radix-ui/react-dialog@1.1.19'
  - '@radix-ui/react-dismissable-layer@1.1.15'
  - '@radix-ui/react-dropdown-menu@2.1.20'
  - '@radix-ui/react-focus-scope@1.1.12'
  - '@radix-ui/react-form@0.1.12'
  - '@radix-ui/react-hover-card@1.1.19'
  - '@radix-ui/react-menu@2.1.20'
  - '@radix-ui/react-menubar@1.1.20'
  - '@radix-ui/react-navigation-menu@1.2.18'
  - '@radix-ui/react-one-time-password-field@0.1.12'
  - '@radix-ui/react-password-toggle-field@0.1.7'
  - '@radix-ui/react-popover@1.1.19'
  - '@radix-ui/react-popper@1.3.3'
  - '@radix-ui/react-presence@1.1.7'
  - '@radix-ui/react-progress@1.1.12'
  - '@radix-ui/react-radio-group@1.4.3'
  - '@radix-ui/react-roving-focus@1.1.15'
  - '@radix-ui/react-scroll-area@1.2.14'
  - '@radix-ui/react-select@2.3.3'
  - '@radix-ui/react-slider@1.4.3'
  - '@radix-ui/react-switch@1.3.3'
  - '@radix-ui/react-tabs@1.1.17'
  - '@radix-ui/react-toast@1.2.19'
  - '@radix-ui/react-toggle-group@1.1.15'
  - '@radix-ui/react-toggle@1.1.14'
  - '@radix-ui/react-toolbar@1.1.15'
  - '@radix-ui/react-tooltip@1.2.12'
  - '@turbo/darwin-64@2.10.4'
  - '@turbo/darwin-arm64@2.10.4'
  - '@turbo/linux-64@2.10.4'
  - '@turbo/linux-arm64@2.10.4'
  - '@turbo/windows-64@2.10.4'
  - '@turbo/windows-arm64@2.10.4'
  - '@typescript-eslint/eslint-plugin@8.63.0'
  - '@typescript-eslint/parser@8.63.0'
  - '@typescript-eslint/project-service@8.63.0'
  - '@typescript-eslint/scope-manager@8.63.0'
  - '@typescript-eslint/tsconfig-utils@8.63.0'
  - '@typescript-eslint/type-utils@8.63.0'
  - '@typescript-eslint/types@8.63.0'
  - '@typescript-eslint/typescript-estree@8.63.0'
  - '@typescript-eslint/utils@8.63.0'
  - '@typescript-eslint/visitor-keys@8.63.0'
  - radix-ui@1.6.2
  - turbo@2.10.4
  - typescript-eslint@8.63.0

# Force a single @codemirror/view copy. @codemirror/language@6.12.3 pulled in
# 6.41.1 while @uiw/react-codemirror / codemirror@6.0.2 used 6.43.0. Two view
# copies make CodeMirror silently drop the syntax-highlighting ViewPlugin
# (built against the other copy), so the Custom Tool Groovy editor rendered
# uncolored even though autocomplete (state/facet-based) still worked.
overrides:
  "@codemirror/view": "6.43.0"
