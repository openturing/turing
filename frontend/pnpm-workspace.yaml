packages:
  - "apps/turing-app"
  - "apps/site"
  - "apps/showcase"
  - "apps/marketplace/*"
  - "packages/*"

# Dependencies allowed to run install/build scripts. pnpm 11 replaced the
# package.json "pnpm.onlyBuiltDependencies" list with this name -> bool map and
# blocks unlisted build scripts by default (strictDepBuilds).
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@tailwindcss/oxide": true

# T1014 — one entry per package name, versions joined with '||'. pnpm's
# evaluateVersionPolicy returns on the FIRST rule whose name matches and never
# looks at the rest, so a second line for a name already listed above is dead
# config: it reads like a waiver and waives nothing. That is how
# viglet-design-system@2026.3.3 stayed blocked while sitting in this list --
# the 2026.3.2 line here answered for the name first.
minimumReleaseAgeExclude:
