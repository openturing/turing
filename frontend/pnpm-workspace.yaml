packages:
  - "apps/turing-app"
  - "apps/site"
  - "apps/showcase"
  - "apps/marketplace/*"
  - "packages/*"

# Dependencies allowed to run install/build scripts. pnpm 11 replaced the
# package.json "pnpm.onlyBuiltDependencies" list with this name -> bool map and
# blocks unlisted build scripts by default (strictDepBuilds).
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@tailwindcss/oxide": true
