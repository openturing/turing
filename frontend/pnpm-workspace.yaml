# Force a single @codemirror/view copy. @codemirror/language@6.12.3 pulled in
# 6.41.1 while @uiw/react-codemirror / codemirror@6.0.2 used 6.43.0. Two view
# copies make CodeMirror silently drop the syntax-highlighting ViewPlugin
# (built against the other copy), so the Custom Tool Groovy editor rendered
# uncolored even though autocomplete (state/facet-based) still worked.
overrides:
  "@codemirror/view": "6.43.0"
  # T654 / §XXXVII.16 — remediate open Dependabot highs/mediums in transitive
  # deps: undici (SOCKS5 TLS-bypass / cross-origin routing / WS DoS), js-yaml
  # (quadratic-DoS in merge keys), @babel/core (arbitrary file read via
  # sourceMappingURL).
  "undici": ">=7.28.0"
  # Keep the security floor (>=7.29.6) but stay on the Babel 7 line. An
  # open-ended ">=7.29.6" let pnpm pull @babel/core 8.0.1 into every consumer;
  # Babel 8's loadPartialConfig is now callback-only, which breaks
  # react-docgen@8.0.3 (calls it synchronously) and fails the Storybook build.
  # No dependency actually requires Babel 8 — everything declares ^7.x.
  "@babel/core": ">=7.29.6 <8"
  "js-yaml@3": ">=3.15.0"
  # adm-zip <0.6.0: a crafted ZIP triggers a 4GB memory allocation
  # (GHSA-xcpc-8h2w-3j85). Transitive only via @module-federation/dts-plugin
  # (build-time .d.ts extraction for Module Federation) — never runs at
  # app runtime. 0.6.0 is API-compatible; force the patched line.
  "adm-zip": ">=0.6.0"

# T654 / §XXXVII.16 — audit gate exclusions. xlsx (SheetJS) has NO npm fix (npm
# is frozen at 0.18.5; fixes ship only on the vendor CDN, which pnpm's
# blockExoticSubdeps policy disallows as a subdependency). It is EXPORT-ONLY in
# Turing (`exportToXlsx`; the app never parses untrusted spreadsheets), so the
# ReDoS + prototype-pollution parse paths are unreachable — accepted risk. Any
# NEW high in another package still fails `pnpm audit --audit-level high`.
auditConfig:
  ignoreGhsas:
    - GHSA-5pgg-2g8v-p4x9   # xlsx ReDoS (parse-path, unreachable — export only)
    - GHSA-4r6h-8v6p-xvw6   # xlsx prototype pollution (parse-path, unreachable)
