# Force a single @codemirror/view copy. @codemirror/language@6.12.3 pulled in
# 6.41.1 while @uiw/react-codemirror / codemirror@6.0.2 used 6.43.0. Two view
# copies make CodeMirror silently drop the syntax-highlighting ViewPlugin
# (built against the other copy), so the Custom Tool Groovy editor rendered
# uncolored even though autocomplete (state/facet-based) still worked.
overrides:
  "@codemirror/view": "6.43.0"
  # T654 / §XXXVII.16 — remediate open Dependabot highs/mediums in transitive
  # deps: undici (SOCKS5 TLS-bypass / cross-origin routing / WS DoS), js-yaml
  # (quadratic-DoS in merge keys), @babel/core (arbitrary file read via
  # sourceMappingURL).
  # T913 — keep the security floor (>=7.28.0) but stay on the undici 7 line, the
  # same accident @babel/core hit below. jsdom@29 declares `undici: ^7.25.0`; an
  # open-ended override outranks that range and linked undici 8.7.0, which
  # removed `lib/handler/wrap-handler.js` — so `Window.js` failed to load and
  # every `environment: "jsdom"` suite in the repo died before its first test.
  "undici": ">=7.28.0 <8"
  # Keep the security floor (>=7.29.6) but stay on the Babel 7 line. An
  # open-ended ">=7.29.6" let pnpm pull @babel/core 8.0.1 into every consumer;
  # Babel 8's loadPartialConfig is now callback-only, which breaks
  # react-docgen@8.0.3 (calls it synchronously) and fails the Storybook build.
  # No dependency actually requires Babel 8 — everything declares ^7.x.
  "@babel/core": ">=7.29.6 <8"
  # T934 — kept deliberately, though it selects nothing today. js-yaml 3.14.2 was
  # in the tree when T654 wrote this; whatever pulled it has since gone, and
  # `check-overrides.mjs` now reports the entry as "selects nothing".
  #
  # The rule for this block, so the next such entry does not need re-litigating:
  # a **security floor** stays after its dependency leaves — it costs nothing and
  # caps a vulnerable copy on arrival if some future transitive reintroduces the
  # line. A **compatibility pin** (@codemirror/view below) does not: it encodes a
  # conflict that can be resolved upstream, so an inert one is stale and goes.
  "js-yaml@3": ">=3.15.0"
  # T927 — four advisories whose fix is a patch inside the major already
  # resolved, so each is a floor and not a migration. The versions in the tree
  # when this was written: fast-uri 3.1.3/3.1.4, js-yaml 4.3.0 and 5.2.1,
  # postcss 8.5.15, brace-expansion 5.0.7.
  # Each floor is capped at its major. An open-ended range outranks the
  # requester's own and jumps it a major — the T913 accident, which this hit on
  # the first attempt: ">=3.1.5" resolved fast-uri 4.1.2 under an ajv wanting 3.x.
  "fast-uri": ">=3.1.5 <4"
  "js-yaml@^4.0.0": ">=4.3.1 <5"
  # The 5.x line reaches the tree only through `read-yaml-file`, under
  # @changesets/cli. A `js-yaml@5` version-selector key did not match it, so this
  # is scoped by path instead — narrower than a bare `js-yaml` floor, which would
  # drag the 4.x consumers a major.
  "read-yaml-file>js-yaml": ">=5.2.2 <6"
  "postcss": ">=8.5.18"
  "brace-expansion": ">=5.0.9"
  # adm-zip <0.6.0: a crafted ZIP triggers a 4GB memory allocation
  # (GHSA-xcpc-8h2w-3j85). Transitive only via @module-federation/dts-plugin
  # (build-time .d.ts extraction for Module Federation) — never runs at
  # app runtime. 0.6.0 is API-compatible; force the patched line.
  "adm-zip": ">=0.6.0"

# T654 / §XXXVII.16 — audit gate exclusions. xlsx (SheetJS) has NO npm fix (npm
# is frozen at 0.18.5; fixes ship only on the vendor CDN, which pnpm's
# blockExoticSubdeps policy disallows as a subdependency). It is EXPORT-ONLY in
# Turing (`exportToXlsx`; the app never parses untrusted spreadsheets), so the
# ReDoS + prototype-pollution parse paths are unreachable — accepted risk. Any
# NEW high in another package still fails `pnpm audit --audit-level high`.
auditConfig:
  ignoreGhsas:
    - GHSA-5pgg-2g8v-p4x9 # xlsx ReDoS (parse-path, unreachable — export only)
    - GHSA-4r6h-8v6p-xvw6 # xlsx prototype pollution (parse-path, unreachable)
    # T927 — react-router "RSC Mode CSRF Bypass Allows Action Execution Before
    # 400 Response". The flaw is in the RSC request handler: an action runs before
    # the origin check rejects the request. Unreachable here, and not merely
    # unused — the runtime it lives in is not installed. No `@react-router/*`
    # package is in the tree, no `react-router.config.*` exists, and nothing
    # references `unstable_RSC`, `RSCHydratedRouter` or `createStaticHandler`.
    # Every app is a client SPA mounting `BrowserRouter` (1), `HashRouter` (4) or
    # `MemoryRouter` (13, in tests); none defines a server action for the
    # vulnerable path to execute.
    #
    # Fixed only in react-router 8.3.0, and `react-router-dom` has no 8.x — v8
    # folds it into `react-router`. Taking the fix therefore means dropping
    # react-router-dom and rewriting the import in 220 files, 204 of them in the
    # admin console: a breaking major to close a path that does not exist here.
    #
    # REVISIT if any app adopts react-router framework/RSC mode, i.e. the moment a
    # `@react-router/*` dependency or a `react-router.config.*` appears.
    - GHSA-qwww-vcr4-c8h2 # react-router RSC CSRF (RSC mode not installed)
