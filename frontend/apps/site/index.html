    <!-- anti-FOUC: apply the stored theme class before first paint (prerendered HTML paints before the bundle) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("turing-site-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              globalThis.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked — fall back to default (light) theme */
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
