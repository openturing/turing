# =============================================================================
# Viglet Turing ES — Minimal Docker Compose (HTTPS, self-signed at startup)
# =============================================================================
# The smallest possible way to run Turing over HTTPS: a single container, no
# external services and no manual certificate step. It relies on the app's
# built-in defaults for everything else:
#
#   * Database        -> embedded H2 (file, under /app/store/db)
#   * Search engine   -> embedded Lucene (turing.solr.enabled=false)
#   * Message queue   -> embedded Artemis (in-memory, see below)
#   * Asset storage   -> local filesystem (/app/store/assets)
#   * TLS             -> Spring Boot native (server.ssl.*), no nginx/proxy
#
# The entrypoint generates a self-signed PKCS12 keystore on first boot with the
# JRE's own `keytool` (no extra library) and stores it in the persistent volume,
# so it is created once and reused on every restart.
#
# Run it:
#   docker compose -f docker-compose-minimal.yaml up -d
#
# Then open https://localhost (the browser warns on the self-signed cert — for
# production, drop a CA-issued cert at /app/store/cert/turing.p12 in the volume,
# or terminate TLS at a reverse proxy instead).
#
# For the full production-style stack (Solr Cloud + MariaDB + monitoring),
# use docker-compose.yaml instead.
# =============================================================================
services:
  turing:
    container_name: turing
    # Pre-built image published by CI. To build from this working tree instead,
    # comment out `image:` and uncomment `build: .`.
    image: ghcr.io/openviglet/turing-ce:latest
    # build: .
    restart: unless-stopped
    ports:
      # HTTPS on host ports 443 and 2700 for every IP (Docker binds 0.0.0.0 by
      # default). Multiple host ports may map to the same container port. With
      # SSL enabled the app serves ONLY HTTPS on its internal 2700 — there is no
      # plain-HTTP listener. Use "127.0.0.1:443:2700" to expose only on localhost.
      - "443:2700"
      - "2700:2700"
    environment:
      # Master key for encrypting stored provider API keys / credentials. The
      # `production` profile refuses to start with a blank key — CHANGE THIS to
      # your own random secret before any real deployment.
      TURING_AI_CRYPTO_KEY: change-me-to-a-random-secret
      # Public base URL / allowed CORS origins. Point these at how users actually
      # reach the server (https now that TLS is on).
      TURING_URL: https://localhost
      TURING_ALLOWEDORIGINS: https://localhost
      # --- Spring Boot native TLS (keystore auto-generated by the entrypoint) ---
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /app/store/cert/turing.p12
      SERVER_SSL_KEY_STORE_PASSWORD: turing
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: turing
      # Run the embedded Artemis broker in-memory. Avoids the persistent journal
      # lock in /app/store/queue that breaks the JMS listener (AMQ219007) when a
      # container is recreated over the same volume or shut down uncleanly. The
      # indexing.queue is transient work — losing it on restart is fine here.
      SPRING_ARTEMIS_EMBEDDED_PERSISTENT: "false"
    # Generate a self-signed keystore on first boot (idempotent — skipped once it
    # exists), then launch the app. `$$` escapes the shell vars so Compose does
    # not interpolate them; the java flags mirror the image's default entrypoint.
    entrypoint:
      - sh
      - -c
      - |
        KS=/app/store/cert/turing.p12
        if [ ! -f "$$KS" ]; then
          echo "Generating self-signed keystore at $$KS ..."
          mkdir -p /app/store/cert
          keytool -genkeypair -alias turing -keyalg RSA -keysize 2048 \
            -storetype PKCS12 -keystore "$$KS" -validity 3650 \
            -storepass turing -dname "CN=localhost"
        fi
        exec java $$JAVA_OPTS $$DEBUG_OPTS \
          -Djava.security.egd=file:/dev/./urandom \
          -Dlogging.config=classpath:logback-spring-console.xml \
          -jar /app/app.jar
    volumes:
      # All state (H2 DB, Lucene index, assets, logs, ONNX cache, TLS keystore)
      # in one persistent volume so restarts keep your data.
      - vol-turing-store:/app/store
      # ─────────────────── Code Interpreter DOCKER mode (T80) ────────────────
      # The bundled image ships the `docker` CLI, so the containerized Code
      # Interpreter ("DOCKER" execution mode) works with Docker-out-of-Docker:
      # mount the host socket so Turing can spawn sandbox containers on the host.
      #   - /var/run/docker.sock:/var/run/docker.sock
      # CRITICAL: sandbox session dirs are bind-mounted BY ABSOLUTE PATH
      # (/app/store/code-interpreter/...) and resolved by the HOST daemon against
      # the HOST filesystem. So the store must live on the host at the SAME path.
      # Replace the named volume above with a host bind mount at /app/store:
      #   - /opt/turing/store:/app/store   # (remove the vol-turing-store line)
      # and `mkdir -p /opt/turing/store && chown 1001:1001 /opt/turing/store`.
      # A named volume will NOT work for DOCKER mode (its host path differs from
      # /app/store, so the sandbox sees an empty mount).
      # Then, in Console -> Global Settings -> Code Interpreter, set the mode to
      # DOCKER and click "Check Docker".
    # DOCKER mode only: let the non-root `java` process (uid 1001) use the
    # mounted host socket. Replace 999 with the host docker gid
    # (`getent group docker | cut -d: -f3`).
    # group_add:
    #   - "999"

volumes:
  vol-turing-store:
